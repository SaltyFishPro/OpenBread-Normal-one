<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ededeb">
<title>OpenBread 文件管理 · 设计预览</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ededeb;--card:#f7f7f4;--white:#fff;
  --ink:#121212;--ink2:#3b3b37;--muted:#7c7c76;--faint:#a3a39c;
  --line:#e2e2dd;--line2:#efefea;
  --orange:#ff5c22;--orange-soft:#ffe7dd;
  --r-lg:20px;--r-md:14px;
  --shadow:0 1px 2px rgba(18,18,18,.04),0 8px 24px rgba(18,18,18,.05);
  --tabs:58px;
}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(var(--tabs) + 26px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit}
.demo{
  max-width:560px;margin:0 auto;padding:9px 14px 0;
}
.demo span{
  display:inline-block;font-size:11.5px;font-weight:700;color:#8a6a1f;
  background:#fdf3d8;border:1px dashed #e3c766;border-radius:999px;padding:3px 10px;
}
.app{max-width:560px;margin:0 auto;padding:0 14px;position:relative}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:2px;
  padding:8px 0 10px;background:var(--bg);
}
.titlebox{flex:1;min-width:0;padding:0 2px}
.titlebox b{display:block;font-size:19px;font-weight:800;letter-spacing:-.3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titlebox small{display:block;font-size:11.5px;color:var(--faint);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.icobtn{
  width:38px;height:38px;flex:0 0 auto;border:0;border-radius:12px;background:none;
  display:grid;place-items:center;color:var(--ink2);cursor:pointer;
}
.icobtn:active{background:#e3e3dd}
.icobtn svg{width:21px;height:21px}
.selhead{
  position:sticky;top:0;z-index:31;display:flex;align-items:center;gap:4px;
  padding:8px 0 10px;background:var(--bg);
}
.selhead b{flex:1;font-size:17px;font-weight:800}
.linkbtn{border:0;background:none;color:var(--orange);font-weight:700;font-size:13.5px;
  padding:9px 10px;border-radius:10px;cursor:pointer}
.searchwrap{padding:0 0 10px}
.searchwrap input{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:13px;
  background:var(--white);font:inherit;font-size:14px;color:var(--ink);outline:none;
}
.searchwrap input:focus{border-color:#ffb08e;box-shadow:0 0 0 3px var(--orange-soft)}

/* ---------- 存储概览 ---------- */
.hero{
  display:flex;align-items:center;gap:14px;background:var(--white);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;
  box-shadow:var(--shadow);margin:0 0 14px;
}
.donut{
  width:58px;height:58px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--orange) 0 calc(var(--pct,62)*1%),#e9e9e3 0);
  transition:background .3s;
}
.donut i{
  width:44px;height:44px;border-radius:50%;background:var(--white);display:grid;
  place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--orange);
}
.hero .txt{min-width:0;flex:1}
.hero .txt b{display:block;font-size:14.5px;font-weight:750}
.hero .txt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.hero .free{text-align:right;flex:0 0 auto}
.hero .free b{display:block;font-size:15px;font-weight:800}
.hero .free small{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}

/* ---------- 分类 ---------- */
.selmode .hero,.selmode .chips{display:none}
.selmode .list{margin-top:4px}

.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:0 0 14px}
.chip{
  min-width:0;padding:10px 4px 9px;border:1px solid var(--line);
  border-radius:16px;background:var(--white);display:flex;flex-direction:column;
  align-items:center;gap:6px;cursor:pointer;
}
.chip:active{transform:scale(.97)}
.chip .ico{width:28px;height:28px;border-radius:9px}
.chip .ico svg{width:17px;height:17px}
.chip b{font-size:12px;font-weight:650;color:var(--ink2)}
.chip em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--faint);margin-top:-3px}

/* ---------- 工具行 ---------- */
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 9px}
.count{font-size:12px;color:var(--muted);font-weight:500;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolsright{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.sortbtn{
  border:1px solid var(--line);background:var(--white);border-radius:10px;
  padding:6px 10px;font-size:12px;font-weight:650;color:var(--ink2);cursor:pointer;
  display:flex;align-items:center;gap:4px;
}
.sortbtn svg{width:12px;height:12px;color:var(--faint)}
.seg{display:flex;gap:2px;background:#e4e4de;border-radius:10px;padding:3px}
.seg button{
  border:0;background:none;border-radius:8px;padding:5px 7px;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;
}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.09)}

/* ---------- 文件列表 ---------- */
.list{
  list-style:none;margin:0;padding:0;background:var(--white);border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);
}
.item{
  display:flex;align-items:center;gap:12px;padding:11px 13px;cursor:pointer;
  border-bottom:1px solid var(--line2);position:relative;
}
.item:last-child{border-bottom:0}
.item:active{background:#f2f2ed}
.item.picked{background:#fff5ef}
.ico{
  width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  color:#6b6b64;background:#eeece7;
}
.ico svg{width:21px;height:21px}
.ico.folder{color:#ef7125;background:var(--orange-soft)}
.ico.audio{color:#7150f0;background:#ece8ff}
.ico.image{color:#0f9c60;background:#e2f5ec}
.ico.gif{color:#0d87a3;background:#e0f2f6}
.ico.text{color:#2f7bea;background:#e6effd}
.ico.font{color:#bd2589;background:#fbe7f2}
.meta{flex:1;min-width:0}
.meta b{
  display:block;font-size:14.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.meta span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:#c8c8c1;flex:0 0 auto;display:grid;place-items:center}
.chev svg{width:17px;height:17px}
.check{
  width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:2px solid #d2d2cb;
  display:none;place-items:center;transition:.15s;
}
.check::after{
  content:'';width:5px;height:9px;border:2px solid var(--white);border-top:0;border-left:0;
  transform:rotate(45deg) translate(-1px,-1px);opacity:0;
}
.item.picked .check{background:var(--orange);border-color:var(--orange)}
.item.picked .check::after{opacity:1}
.sel .check{display:grid}
.sel .chev{display:none}

/* 网格 */
.list.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:none;
  border:0;box-shadow:none;border-radius:0;overflow:visible}
.grid .item{
  flex-direction:column;align-items:flex-start;gap:8px;background:var(--white);
  border:1px solid var(--line);border-radius:16px;padding:12px;
}
.grid .item.picked{border-color:#ffbb9d;background:#fff7f3}
.grid .ico{width:42px;height:42px}
.grid .meta{width:100%}
.grid .meta b{
  white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  font-size:12.5px;line-height:1.35;min-height:2.7em;
}
.grid .meta span{font-size:11px}
.grid .check{display:none;position:absolute;top:9px;right:9px}
.grid.sel .check{display:grid}
.grid .chev{display:none}

/* 空状态 */
.empty{
  background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:34px 20px;text-align:center;box-shadow:var(--shadow);
}
.empty .ring{
  width:64px;height:64px;border-radius:50%;border:2px dashed #d8d8d1;margin:0 auto 14px;
  display:grid;place-items:center;color:#c3c3bc;
}
.empty .ring svg{width:26px;height:26px}
.empty b{display:block;font-size:14.5px;font-weight:700}
.empty p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}

/* ---------- 悬浮操作 ---------- */
.fab{
  position:fixed;z-index:41;right:max(16px,calc(50% - 264px));
  bottom:calc(var(--tabs) + 20px + env(safe-area-inset-bottom));
  width:56px;height:56px;border:0;border-radius:18px;background:var(--orange);color:#fff;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 10px 24px rgba(255,92,34,.38);
}
.fab:active{transform:scale(.95)}
.fab svg{width:26px;height:26px}

.actbar{
  position:fixed;z-index:40;left:0;right:0;
  bottom:calc(var(--tabs) + 16px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;padding:0 16px;pointer-events:none;
}
.actbar>div{
  pointer-events:auto;display:flex;gap:2px;background:#181817;border-radius:17px;padding:6px;
  box-shadow:0 14px 32px rgba(0,0,0,.3);max-width:520px;
}
.actbar button{
  border:0;background:none;color:#fff;font-size:11.5px;font-weight:650;min-width:62px;
  padding:8px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  gap:4px;cursor:pointer;
}
.actbar button:active{background:#2c2c29}
.actbar button svg{width:19px;height:19px}
.actbar button.danger{color:#ff9070}
.actbar button[disabled]{opacity:.35}

/* ---------- 底部导航 ---------- */
.tabs{
  position:fixed;z-index:45;left:0;right:0;bottom:0;display:flex;justify-content:center;
  background:rgba(247,247,244,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));
}
.tabs button{
  border:0;background:none;color:var(--faint);font-size:10.5px;font-weight:650;
  min-width:74px;padding:4px 8px;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;gap:2px;cursor:pointer;
}
.tabs button svg{width:21px;height:21px}
.tabs button.on{color:var(--orange)}

/* ---------- 弹层 ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(18,18,18,.36);
  opacity:0;transition:opacity .18s;
}
.scrim.on{opacity:1}
.sheet{
  position:fixed;z-index:61;left:0;right:0;bottom:0;
  transform:translateY(101%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
}
.sheet.on{transform:none}
.sheet>div{
  max-width:560px;margin:0 auto;background:var(--white);border-radius:22px 22px 0 0;
  padding:0 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.12);
}
.grab{width:38px;height:4px;border-radius:4px;background:#dcdcd6;margin:9px auto 14px}
.sheet h3{margin:0 0 12px;font-size:16px;font-weight:800}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{
  display:flex;align-items:center;gap:12px;text-align:left;background:#f5f5f1;
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;
  font-weight:650;cursor:pointer;
}
.menu button:active{background:#ecece6}
.menu button[disabled]{opacity:.45}
.menu button .ico{width:36px;height:36px;border-radius:11px;flex:0 0 auto}
.menu button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.menu button span{flex:1;min-width:0}
.upname{font-size:13.5px;font-weight:700;margin:0 0 4px;overflow-wrap:anywhere}
.upmeta{font-size:12px;color:var(--muted);margin:0 0 12px}
progress{
  width:100%;height:8px;border:0;border-radius:8px;overflow:hidden;
  background:#e8e8e2;appearance:none;
}
progress::-webkit-progress-bar{background:#e8e8e2;border-radius:8px}
progress::-webkit-progress-value{background:var(--orange);border-radius:8px}
progress::-moz-progress-bar{background:var(--orange);border-radius:8px}
.sheetactions{display:flex;gap:8px;margin-top:14px}
.sheetactions button{
  flex:1;border:0;border-radius:13px;padding:12px;font-weight:700;font-size:14px;
  background:#ececE6;cursor:pointer;
}
.sheetactions button.primary{background:var(--orange);color:#fff}

/* ---------- 提示 ---------- */
.toast{
  position:fixed;z-index:70;left:50%;bottom:calc(var(--tabs) + 96px + env(safe-area-inset-bottom));
  transform:translate(-50%,8px);max-width:88vw;text-align:center;
  background:#181817;color:#fff;font-size:12.5px;font-weight:650;
  padding:10px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 桌面 ---------- */
@media (min-width:640px){
  body{background:#e7e7e3}
  .demo,.app{max-width:560px}
  .app{background:var(--bg);border-radius:0}
  .list:not(.grid){border-radius:var(--r-lg)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="demo"><span>设计预览 · 演示数据，未连接真实设备</span></div>

<div class="app">
  <header class="top" id="top">
    <button class="icobtn" id="back" aria-label="返回上级">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="titlebox">
      <b id="title">SD 卡</b>
      <small id="path">/</small>
    </div>
    <button class="icobtn" id="searchbtn" aria-label="筛选当前文件夹">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    </button>
    <button class="icobtn" id="viewbtn" aria-label="切换视图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.6"/><rect x="14" y="4" width="6" height="6" rx="1.6"/><rect x="4" y="14" width="6" height="6" rx="1.6"/><rect x="14" y="14" width="6" height="6" rx="1.6"/></svg>
    </button>
  </header>

  <header class="selhead" id="selhead" hidden>
    <button class="icobtn" id="selclose" aria-label="退出多选">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <b id="selcount">已选 0 项</b>
    <button class="linkbtn" id="selall">全选</button>
  </header>

  <div class="searchwrap" id="searchwrap" hidden>
    <input id="q" type="search" placeholder="在当前文件夹中筛选名称" autocomplete="off">
  </div>

  <section class="hero" id="hero">
    <div class="donut" aria-hidden="true"><i id="pct">62%</i></div>
    <div class="txt">
      <b>内部存储 · SD 卡</b>
      <small id="usedline">已用 3.4 GB / 14.6 GB</small>
    </div>
    <div class="free">
      <b id="freeline">11.2 GB</b>
      <small>可用</small>
    </div>
  </section>

  <div class="chips" id="chips"></div>

  <div class="tools">
    <span class="count" id="count"></span>
    <div class="toolsright">
      <button class="sortbtn" id="sortbtn">
        <span id="sortlabel">名称</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>
      <div class="seg">
        <button id="vlist" class="on" aria-label="列表视图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button id="vgrid" aria-label="网格视图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.8"/></svg>
        </button>
      </div>
    </div>
  </div>

  <ul class="list" id="list" role="list"></ul>

  <div class="empty" id="empty" hidden>
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h7A1.5 1.5 0 0 1 19 9.5v8A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/></svg>
    </div>
    <b>这个文件夹是空的</b>
    <p>点右下角的 + 上传文件或新建文件夹。</p>
  </div>
</div>

<button class="fab" id="fab" aria-label="新建或上传">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="actbar" id="actbar" hidden>
  <div>
    <button id="aDownload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
      下载
    </button>
    <button id="aRename">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"/></svg>
      重命名
    </button>
    <button id="aDelete" class="danger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9 7V5h6v2M7 7l1 12h8l1-12"/></svg>
      删除
    </button>
    <button id="aMore" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>
      更多
    </button>
  </div>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="overview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
    概览
  </button>
  <button data-tab="files" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h7A1.5 1.5 0 0 1 19 9.5v8A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/></svg>
    文件
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M4 12h2m12 0h2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4m0-11.4-1.4 1.4M7.7 16.3l-1.4 1.4"/></svg>
    设置
  </button>
  <button data-tab="update">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v9m0 0 3.5-3.5M12 13 8.5 9.5"/><path d="M5 17.5A3.5 3.5 0 0 0 8.5 21h7a3.5 3.5 0 0 0 3.5-3.5"/></svg>
    更新
  </button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet"><div id="sheetbody"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileinput" hidden multiple>

<script>
"use strict";

/* ===== 演示数据（真实页面里由 /api/files 返回） ===== */
const TREE = {
  "/": [
    { n: "Font", d: 1, m: "今天 08:40" },
    { n: "Music", d: 1, m: "今天 09:12" },
    { n: "Book", d: 1, m: "昨天 22:31" },
    { n: "Gif", d: 1, m: "11-14 18:02" },
    { n: "models", d: 1, m: "11-12 10:15" },
    { n: "settings.json", s: 412, m: "今天 09:20" },
    { n: "日志.txt", s: 4196, m: "今天 09:04" }
  ],
  "/Font": [
    { n: "font-14-ui.bin", s: 62092, m: "11-14 20:11" },
    { n: "font-20-ui.bin", s: 118440, m: "11-14 20:11" },
    { n: "font-24-ui.bin", s: 131072, m: "11-14 20:11" },
    { n: "font-full.bin", s: 3355443, m: "11-14 20:09" }
  ],
  "/Music": [
    { n: "夜曲.mp3", s: 8410624, m: "今天 09:12" },
    { n: "晴天.mp3", s: 9123456, m: "昨天 21:40" },
    { n: "稻香.flac", s: 24681728, m: "11-13 19:02" }
  ],
  "/Book": [
    { n: "三体.txt", s: 1887436, m: "昨天 22:31" },
    { n: "我的世界.json", s: 412, m: "11-12 10:02" }
  ],
  "/Gif": [
    { n: "loading.gif", s: 98304, m: "11-14 18:02" }
  ],
  "/models": [
    { n: "cube.obj", s: 12288, m: "11-12 10:15" }
  ]
};
const CAP = 14.6 * 1024 * 1024 * 1024;
const USED = 3.4 * 1024 * 1024 * 1024;

/* ===== 图标 ===== */
const P = {
  folder: '<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h7A1.5 1.5 0 0 1 19 9.5v8A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/>',
  audio: '<path d="M9 17V6l10-2v11"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/>',
  image: '<rect x="3.5" y="5" width="17" height="14" rx="2.4"/><circle cx="8.8" cy="10" r="1.5"/><path d="m4.5 17 5-5 3.6 3.6L16 12.6l3.5 3.5"/>',
  gif: '<rect x="3" y="5" width="18" height="14" rx="2.4"/><path d="M8 10v4m5-4h-3v4h3m2-4v4"/>',
  text: '<path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4"/><path d="M10 13h5M10 16.5h5"/>',
  font: '<path d="M5.5 19 12 5l6.5 14"/><path d="M8.2 14.5h7.6"/>',
  file: '<path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4"/>'
};
function svg(kind, w) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round">' + (P[kind] || P.file) + "</svg>";
}

/* ===== 工具 ===== */
const $ = (id) => document.getElementById(id);
function kindOf(e) {
  if (e.d) return "folder";
  const ext = (e.n.split(".").pop() || "").toLowerCase();
  if (["mp3", "flac", "wav", "m4a", "aac", "ogg"].includes(ext)) return "audio";
  if (["png", "jpg", "jpeg", "webp", "bmp"].includes(ext)) return "image";
  if (ext === "gif") return "gif";
  if (["txt", "md", "json", "csv", "log", "ini"].includes(ext)) return "text";
  if (["bin", "ui"].includes(ext)) return "font";
  return "file";
}
const TYPE_NAME = {
  folder: "文件夹", audio: "音频", image: "图片", gif: "动图",
  text: "文本", font: "字体资源", file: "文件"
};
function size(n) {
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + " GB";
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  if (n >= 1024) return (n / 1024).toFixed(1) + " KB";
  return n + " B";
}
function esc(v) {
  return String(v).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
let toastTimer = 0;
function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2000);
}

/* ===== 状态 ===== */
const S = { path: "/", view: "list", sort: "name", q: "", picked: null, busy: false };
const SORT_NAME = { name: "名称", size: "大小", time: "时间" };
const SORT_NEXT = { name: "size", size: "time", time: "name" };

function join(dir, name) { return dir === "/" ? "/" + name : dir + "/" + name; }
function parentOf(p) {
  if (p === "/") return "/";
  const cut = p.lastIndexOf("/");
  return cut <= 0 ? "/" : p.substring(0, cut);
}
function visible() {
  const raw = TREE[S.path] || [];
  const q = S.q.trim().toLowerCase();
  let rows = raw.filter((e) => !q || e.n.toLowerCase().includes(q));
  rows = rows.slice();
  if (S.sort === "size") rows.sort((a, b) => (b.s || 0) - (a.s || 0));
  else if (S.sort === "time") rows.sort((a, b) => (b.m || "").localeCompare(a.m || ""));
  else rows.sort((a, b) => (b.d ? 1 : 0) - (a.d ? 1 : 0) || a.n.localeCompare(b.n, "zh"));
  return rows;
}

/* ===== 渲染 ===== */
function renderHero() {
  const pct = Math.round(USED / CAP * 100);
  $("hero").style.setProperty("--pct", pct);
  $("pct").textContent = pct + "%";
  $("usedline").textContent = "已用 " + size(USED) + " / " + size(CAP);
  $("freeline").textContent = size(CAP - USED);
}

function renderChips() {
  const buckets = { image: 0, audio: 0, text: 0, font: 0, gif: 0 };
  Object.keys(TREE).forEach((dir) => {
    TREE[dir].forEach((e) => {
      const k = kindOf(e);
      if (buckets[k] !== undefined) buckets[k]++;
    });
  });
  const defs = [
    ["image", "图片"], ["audio", "音乐"], ["text", "文档"],
    ["font", "字体"], ["gif", "动图"]
  ];
  $("chips").innerHTML = defs.map(([k, label]) =>
    '<button class="chip" data-kind="' + k + '">' +
      '<span class="ico ' + k + '">' + svg(k) + "</span>" +
      "<b>" + label + "</b><em>" + buckets[k] + " 个</em>" +
    "</button>").join("");
  $("chips").querySelectorAll(".chip").forEach((btn) => {
    btn.onclick = () => {
      const kind = btn.dataset.kind;
      const hits = [];
      Object.keys(TREE).forEach((dir) => {
        TREE[dir].forEach((e) => { if (kindOf(e) === kind) hits.push(join(dir, e.n)); });
      });
      toast("演示：按类型搜索需要新增接口，已找到 " + hits.length + " 个 " + TYPE_NAME[kind]);
    };
  });
}

function renderList() {
  const rows = visible();
  const list = $("list");
  const selMode = !!S.picked;
  const dirs = rows.filter((e) => e.d).length;
  list.className = "list" + (S.view === "grid" ? " grid" : "") + (selMode ? " sel" : "");
  list.innerHTML = rows.map((e) => {
    const k = kindOf(e);
    const full = join(S.path, e.n);
    const body = TYPE_NAME[k] + (e.d ? "" : " · " + size(e.s || 0));
    const meta = S.view === "grid" || e.d ? body : body + " · " + (e.m || "");
    const on = selMode && S.picked.has(full) ? " picked" : "";
    return '<li class="item' + on + '" role="listitem" data-name="' + esc(e.n) + '" data-dir="' + (e.d ? 1 : 0) + '">' +
      '<span class="ico ' + k + '">' + svg(k) + "</span>" +
      '<span class="meta"><b>' + esc(e.n) + "</b><span>" + esc(meta) + "</span></span>" +
      '<span class="check" aria-hidden="true"></span>' +
      (e.d ? '<span class="chev">' + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>' + "</span>" : "") +
      "</li>";
  }).join("");

  $("empty").hidden = rows.length > 0;
  list.hidden = rows.length === 0;
  if (!rows.length) {
    const emptyBox = $("empty");
    emptyBox.querySelector("b").textContent = S.q ? "没有匹配的文件" : "这个文件夹是空的";
    emptyBox.querySelector("p").textContent = S.q
      ? "换个关键词，或清空筛选后重试。"
      : "点右下角的 + 上传文件或新建文件夹。";
  }

  const files = rows.length - dirs;
  $("count").textContent = S.q
    ? rows.length + " 个匹配项"
    : dirs + " 个文件夹 · " + files + " 个文件";

  list.querySelectorAll(".item").forEach((node) => bindItem(node));
}

function bindItem(node) {
  const name = node.dataset.name;
  const isDir = node.dataset.dir === "1";
  const full = join(S.path, name);
  let timer = 0, longPressed = false;

  const start = () => {
    longPressed = false;
    timer = setTimeout(() => {
      longPressed = true;
      if (!S.picked) S.picked = new Set();
      S.picked.add(full);
      enterSelect();
    }, 480);
  };
  const stop = () => clearTimeout(timer);

  node.addEventListener("pointerdown", start);
  node.addEventListener("pointerup", stop);
  node.addEventListener("pointercancel", stop);
  node.addEventListener("pointerleave", stop);

  node.onclick = () => {
    if (longPressed) { longPressed = false; return; }
    if (S.picked) { togglePick(full, node); return; }
    if (isDir) { open(full, name); return; }
    sheetFile(name);
  };
  node.oncontextmenu = (ev) => {
    ev.preventDefault();
    if (!S.picked) S.picked = new Set();
    S.picked.add(full);
    enterSelect();
  };
}

function togglePick(full, node) {
  if (S.picked.has(full)) S.picked.delete(full);
  else S.picked.add(full);
  node.classList.toggle("picked", S.picked.has(full));
  if (!S.picked.size) exitSelect();
  else updateSelectBar();
}

function updateSelectBar() {
  const n = S.picked ? S.picked.size : 0;
  $("selcount").textContent = "已选 " + n + " 项";
  $("selall").textContent =
    S.picked && S.picked.size === visible().length ? "取消全选" : "全选";
  $("actbar").hidden = n === 0;
  $("aRename").disabled = n !== 1;
  const picked = Array.from(S.picked || []);
  $("aDownload").disabled = picked.some((p) => {
    const name = p.substring(p.lastIndexOf("/") + 1);
    return (TREE[p.substring(0, p.lastIndexOf("/")) || "/"] || [])
      .some((e) => e.n === name && e.d);
  });
}

function enterSelect() {
  document.querySelector(".app").classList.add("selmode");
  $("top").hidden = true;
  $("selhead").hidden = false;
  $("fab").hidden = true;
  $("searchwrap").hidden = true;
  renderList();
  updateSelectBar();
}

function exitSelect() {
  S.picked = null;
  document.querySelector(".app").classList.remove("selmode");
  $("top").hidden = false;
  $("selhead").hidden = true;
  $("actbar").hidden = true;
  $("fab").hidden = false;
  renderList();
}

function renderHeader() {
  const name = S.path === "/" ? "SD 卡" : S.path.substring(S.path.lastIndexOf("/") + 1);
  $("title").textContent = name;
  $("path").textContent = S.path === "/" ? "内部存储 /" : "内部存储 " + S.path;
  $("back").disabled = S.path === "/";
  $("back").style.opacity = S.path === "/" ? ".35" : "1";
}

function renderAll() {
  renderHeader();
  renderList();
  renderChips();
}

function open(path, name) {
  S.path = path;
  S.q = "";
  $("q").value = "";
  renderAll();
  window.scrollTo({ top: 0 });
  $("title").textContent = name;
}
function goBack() {
  if (S.path === "/") return;
  S.path = parentOf(S.path);
  S.q = "";
  $("q").value = "";
  renderAll();
}

/* ===== 视图与排序 ===== */
function setView(v) {
  S.view = v;
  $("vlist").classList.toggle("on", v === "list");
  $("vgrid").classList.toggle("on", v === "grid");
  renderList();
}

/* ===== 弹层 ===== */
function openSheet(html) {
  $("sheetbody").innerHTML = html;
  $("scrim").hidden = false;
  requestAnimationFrame(() => {
    $("scrim").classList.add("on");
    $("sheet").classList.add("on");
  });
}
function closeSheet() {
  $("sheet").classList.remove("on");
  $("scrim").classList.remove("on");
  setTimeout(() => { $("scrim").hidden = true; }, 220);
}
function sheetNew() {
  openSheet(
    '<div class="grab"></div><h3>新建 / 上传</h3><div class="menu">' +
      '<button id="mUpload"><span class="ico folder">' + svg("folder") + '</span><span>上传文件<small>可一次选择多个文件</small></span></button>' +
      '<button id="mMkdir"><span class="ico text">' + svg("text") + '</span><span>新建文件夹<small>写入当前目录</small></span></button>' +
      '<button disabled><span class="ico font">' + svg("font") + '</span><span>新建文本文件<small>需固件新增“新建空文件”接口</small></span></button>' +
    '</div>'
  );
  $("mUpload").onclick = () => { closeSheet(); $("fileinput").click(); };
  $("mMkdir").onclick = () => {
    closeSheet();
    setTimeout(() => {
      const n = prompt("新建文件夹名称");
      if (!n) return;
      TREE[S.path] = TREE[S.path] || [];
      TREE[S.path].push({ n: n, d: 1, m: "刚刚" });
      renderAll();
      toast("演示：已创建 " + n);
    }, 240);
  };
}

function sheetUpload(file) {
  const total = file ? file.size : 0;
  openSheet(
    '<div class="grab"></div><h3>正在上传</h3>' +
    '<p class="upname">' + esc(file ? file.name : "夜曲.mp3") + "</p>" +
    '<p class="upmeta" id="uptext">准备上传…</p>' +
    '<progress id="upbar" max="100" value="0"></progress>' +
    '<div class="sheetactions"><button id="upcancel">取消</button>' +
    '<button class="primary" disabled>演示模式</button></div>'
  );
  let pct = 0;
  const bar = $("upbar"), text = $("uptext");
  const timer = setInterval(() => {
    pct = Math.min(100, pct + 9);
    bar.value = pct;
    text.textContent = pct < 100 ? "正在上传 " + pct + "%（演示）" : "已发送 100%，等待设备保存完成…";
    if (pct >= 100) {
      clearInterval(timer);
      setTimeout(() => {
        closeSheet();
        toast("演示：真实页面会调用 /api/upload 并在成功后刷新列表");
      }, 700);
    }
  }, 160);
  $("upcancel").onclick = () => { clearInterval(timer); closeSheet(); toast("已取消上传"); };
}

function sheetFile(name) {
  openSheet(
    '<div class="grab"></div><h3>' + esc(name) + "</h3>" +
    '<div class="menu">' +
      '<button id="fDown"><span class="ico audio">' + svg("audio") + '</span><span>下载到手机<small>GET /api/download</small></span></button>' +
      '<button id="fRename"><span class="ico text">' + svg("text") + '</span><span>重命名<small>POST /api/file-action op=rename</small></span></button>' +
      '<button id="fDel"><span class="ico font">' + svg("font") + '</span><span>删除<small>POST /api/file-action op=delete</small></span></button>' +
    '</div>'
  );
  $("fDown").onclick = () => { closeSheet(); toast("演示：/api/download?path=" + name); };
  $("fRename").onclick = () => { closeSheet(); toast("演示：重命名走 /api/file-action"); };
  $("fDel").onclick = () => { closeSheet(); toast("演示：删除走 /api/file-action"); };
}

/* ===== 事件绑定 ===== */
$("back").onclick = goBack;
$("viewbtn").onclick = () => setView(S.view === "list" ? "grid" : "list");
$("vlist").onclick = () => setView("list");
$("vgrid").onclick = () => setView("grid");
$("sortbtn").onclick = () => {
  S.sort = SORT_NEXT[S.sort];
  $("sortlabel").textContent = SORT_NAME[S.sort];
  renderList();
};
$("searchbtn").onclick = () => {
  const box = $("searchwrap");
  box.hidden = !box.hidden;
  if (!box.hidden) $("q").focus();
  else { S.q = ""; $("q").value = ""; renderList(); }
};
$("q").oninput = (ev) => { S.q = ev.target.value; renderList(); };
$("fab").onclick = sheetNew;
$("scrim").onclick = closeSheet;
$("selclose").onclick = exitSelect;
$("selall").onclick = () => {
  const rows = visible();
  const all = S.picked && S.picked.size === rows.length;
  S.picked = new Set(all ? [] : rows.map((e) => join(S.path, e.n)));
  if (!S.picked.size) { S.picked = null; exitSelect(); return; }
  renderList();
  updateSelectBar();
};
$("aDownload").onclick = () => {
  toast("演示：逐项调用 /api/download（" + S.picked.size + " 个）");
  exitSelect();
};
$("aRename").onclick = () => {
  const only = Array.from(S.picked)[0];
  const old = only.substring(only.lastIndexOf("/") + 1);
  closeAllSheetsQuietly();
  setTimeout(() => {
    const fresh = prompt("重命名为", old);
    if (!fresh || fresh === old) return;
    const dir = parentOf(only);
    const row = (TREE[dir] || []).find((e) => e.n === old);
    if (row) row.n = fresh;
    exitSelect();
    renderAll();
    toast("演示：已重命名为 " + fresh);
  }, 0);
};
$("aDelete").onclick = () => {
  const n = S.picked.size;
  if (!confirm("删除选中的 " + n + " 项？此操作不可撤销。")) return;
  Array.from(S.picked).forEach((full) => {
    const dir = parentOf(full);
    const name = full.substring(full.lastIndexOf("/") + 1);
    const rows = TREE[dir] || [];
    const idx = rows.findIndex((e) => e.n === name);
    if (idx >= 0) rows.splice(idx, 1);
  });
  exitSelect();
  renderAll();
  toast("演示：已删除 " + n + " 项");
};
$("aMore").onclick = () => toast("复制 / 移动 / 属性需要固件新增接口");
$("fileinput").onchange = (ev) => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  sheetUpload(f);
};
$("tabs").querySelectorAll("button").forEach((b) => {
  b.onclick = () => {
    if (b.dataset.tab === "files") return;
    toast("演示：真实页面在这里切换到“" + b.textContent.trim() + "”");
  };
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") {
    if ($("sheet").classList.contains("on")) closeSheet();
    else if (S.picked) exitSelect();
    else goBack();
  }
});
function closeAllSheetsQuietly() { closeSheet(); }

/* ===== 初始化 ===== */
renderHero();
renderAll();

/* ===== 截图用状态开关：?demo=select|grid|upload|empty ===== */
const demo = new URLSearchParams(location.search).get("demo");
if (demo === "grid") setView("grid");
if (demo === "empty") { TREE["/"] = []; renderAll(); }
if (demo === "upload") sheetUpload({ name: "夜曲.mp3", size: 8410624 });
if (demo === "file") sheetFile("夜曲.mp3");
if (demo === "select") {
  S.picked = new Set(["/Music", "/Book"]);
  enterSelect();
}
</script>
