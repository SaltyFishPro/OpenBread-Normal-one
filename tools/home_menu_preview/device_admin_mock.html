<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenBread · 设备管理预览</title><style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#222820;background:#edf0e9}*{box-sizing:border-box}body{margin:0;padding:38px 20px}main{max-width:1260px;margin:auto}h1{font-size:30px;margin:0 0 8px}p{line-height:1.6;color:#6b7568;margin:0}.intro{margin-bottom:24px}.layout{display:grid;grid-template-columns:minmax(450px,1fr) 420px;gap:24px;align-items:start}.panel{background:white;border:1px solid #dce4d8;border-radius:22px;padding:22px;box-shadow:0 12px 40px #243d1e0a}.caption{display:flex;justify-content:space-between;font-size:12px;color:#778274;margin-bottom:16px}.devicewrap{width:100%;aspect-ratio:384/168;background:#000;overflow:hidden;border-radius:5px}.screen{position:relative;width:384px;height:168px;transform-origin:top left;background:black;color:white;font-family:"Microsoft YaHei",sans-serif;font-size:14px;line-height:1}.head{position:absolute;left:16px;right:16px;top:10px;display:flex;justify-content:space-between;align-items:center;height:16px}.headleft{display:flex;gap:8px;align-items:center}.tinyicon{width:16px;height:16px;border:1px solid white;border-radius:4px;display:inline-grid;place-items:center;font-size:14px}.body{position:absolute;left:16px;right:16px;top:36px;height:100px}.hero{display:flex;gap:20px;align-items:center;height:100%}.symbol{width:76px;height:76px;display:grid;place-items:center;font-size:24px;border:1px solid white;border-radius:50%;flex:none}.big{font-size:24px;line-height:29px;margin-bottom:8px}.medium{font-size:20px;line-height:24px;margin-bottom:7px}.small{font-size:14px;line-height:20px}.qr{position:absolute;right:0;top:-4px;width:100px;height:100px;background:white;padding:4px;image-rendering:pixelated}.copy{width:240px}.foot{position:absolute;left:16px;right:16px;bottom:10px;display:flex;justify-content:space-between;height:18px;align-items:center}.keycap{border:1px solid white;border-radius:4px;padding:1px 5px;margin-right:5px}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}button{font:inherit;cursor:pointer}.buttons button,.scenario button{border:1px solid #d5dfd2;background:#f5f8f3;color:#364531;border-radius:9px;padding:9px 14px}.buttons button:hover,.scenario button:hover{background:#e7eee3}.scenario{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.scenario button{font-size:12px;padding:7px 10px}.devicehint{font-size:12px;margin-top:16px}.phone{background:#f5f7f2;border:1px solid #dce3d8;border-radius:18px;overflow:hidden;min-height:680px}.phonebar{height:61px;background:white;border-bottom:1px solid #e6ebe2;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{display:flex;gap:10px;align-items:center;font-weight:700}.brandicon{width:32px;height:32px;background:#243d2b;color:white;border-radius:10px;display:grid;place-items:center}.badge{border-radius:30px;background:#e9f4e8;color:#3c7349;font-size:12px;padding:6px 10px}.phonebody{padding:20px 18px}.overline{font-size:12px;color:#758172}.phone h2{font-size:24px;letter-spacing:-.5px;margin:4px 0 8px}.lead{font-size:13px}.card{background:white;border:1px solid #e2e9df;border-radius:15px;padding:16px;margin:14px 0}.card h3{font-size:15px;margin:0 0 11px}.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{background:#f6f8f4;border-radius:11px;padding:12px}.tile span{font-size:12px;color:#73806e;display:block;margin-bottom:6px}.tile strong{font-size:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef1ec}.row:last-child{border-bottom:0}.muted{font-size:12px;color:#7d887a}.rowname{font-size:14px;font-weight:600;overflow-wrap:anywhere}.fileicon{width:34px;height:34px;border-radius:10px;background:#edf3e9;display:grid;place-items:center;color:#3c6345;flex:none}.fileleft{display:flex;gap:10px;align-items:center;min-width:0}.filebtn{border:0;background:#f2f5ef;border-radius:8px;padding:7px 9px;color:#52634e;font-size:12px}.primary,.secondary,.danger{border-radius:10px;padding:11px 14px;font-weight:600}.primary{background:#294b32;color:white;border:1px solid #294b32}.secondary{background:white;color:#294b32;border:1px solid #c9d8c5}.danger{background:#fff;color:#a33c36;border:1px solid #edc5c0}.wide{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.nav{display:flex;background:white;border-top:1px solid #e2e9df;justify-content:space-around;padding:12px 3px;position:sticky;bottom:0}.nav button{font:inherit;border:0;background:none;color:#7e8b79;font-size:12px;padding:5px}.nav button.active{color:#24562f;font-weight:700}.nav button span{display:block;font-size:18px;margin-bottom:4px}.label{display:block;font-weight:600;font-size:13px;margin:15px 0 7px}input,select{font:inherit;width:100%;padding:11px 12px;border:1px solid #d6e0d2;border-radius:9px;background:white;color:#293426}input[type=file]{font-size:12px}.footnote{font-size:12px;color:#8b9687;margin-top:14px;line-height:1.6}.path{font-size:12px;color:#72846e;overflow-wrap:anywhere}.toast{color:#3c7349;background:#e7f5e7;border-radius:9px;padding:9px 11px;font-size:12px;margin:12px 0}.progress{height:7px;background:#e8eee5;border-radius:4px;overflow:hidden;margin:12px 0}.progress i{display:block;background:#4a7952;height:100%;width:0}.modalbg{position:fixed;inset:0;background:#16211688;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:white;border-radius:18px;width:min(360px,100%);padding:22px;box-shadow:0 20px 80px #0003}.modal h3{margin:0 0 9px}.modal p{font-size:13px;margin-bottom:18px}.modal .actions{justify-content:flex-end}.hidden{display:none!important}@media(max-width:950px){.layout{grid-template-columns:1fr;max-width:700px}.phone{min-height:0}body{padding:24px 14px}}@media(max-width:520px){.panel{padding:15px}.layout{display:block}.phonepanel{margin-top:16px}.screen{font-size:14px}}

/* Mobile palette and geometry follow flash.openbread.net. */
.phone { background:#ededeb; border-color:#121212; border-radius:4px; }
.brand-logo { display:block; width:135px; height:auto; max-height:34px; object-fit:contain; object-position:left center; }
.phonebar { background:#ededeb; border-top:4px solid #121212; border-bottom:1px solid #121212; }
.brandicon { background:#121212; color:#ff5c22; border-radius:2px; }
.badge { background:#d7d7d2; color:#121212; border:1px solid #121212; border-radius:0; }
.phonebody { background:#ededeb; }
.overline,.muted,.path,.footnote { color:#656560; }
.phone h2 { color:#121212; }
.phone .card { background:#f7f7f4; border:1px solid #b9b9b2; border-radius:0; }
.phone .tile { background:#ededeb; border:1px solid #d7d7d2; border-radius:0; }
.phone .tile span { color:#656560; }
.phone .row { border-bottom:1px solid #d7d7d2; }
.phone .fileicon { background:#d7d7d2; color:#121212; border:1px solid #b9b9b2; border-radius:0; }
.phone .filebtn { background:#f7f7f4; color:#121212; border:1px solid #b9b9b2; border-radius:0; }
.phone .primary,.modal .primary { background:#ff5c22; color:#fff; border:1px solid #ff5c22; border-radius:0; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.phone .secondary,.modal .secondary { background:#f7f7f4; color:#121212; border:1px solid #121212; border-radius:0; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.phone .primary:hover,.modal .primary:hover { background:#d83c0c; }
.phone input,.phone select,.modal input { border:1px solid #b9b9b2; border-radius:0; background:#fff; color:#121212; }
.phone .nav { background:#f7f7f4; border-top:1px solid #121212; }
.phone .nav button { color:#656560; border-radius:0; }
.phone .nav button.active { color:#d83c0c; box-shadow:inset 0 -3px #ff5c22; }
.phone .progress { background:#d7d7d2; border-radius:0; }
.phone .progress i { background:#ff5c22; }
.phone .toast { background:#ededeb; border-left:3px solid #ff5c22; color:#121212; border-radius:0; }
.modal { border-radius:0; border:1px solid #121212; background:#f7f7f4; }
.tinyicon { border:0; border-radius:0; display:block; }
.tinyicon svg,.symbol svg { display:block; width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.symbol svg { width:42px; height:42px; }
</style></head><body><main><h1>设备管理后台</h1><p class="intro">一套预览同时展示设备端与手机端的完整流程。所有数据和操作均为模拟。</p><div class="layout"><section class="panel"><div class="caption"><span>设备端 · 384 × 168</span><span id="device-state">准备开启</span></div><div class="devicewrap" id="devicewrap"><div class="screen" id="screen"></div></div><div class="buttons"><button data-key="left">Left 返回</button><button data-key="up">↑ 上</button><button data-key="down">↓ 下</button><button data-key="ok">OK 确认</button></div><div class="scenario"><button data-scene="entry">重新开始</button><button data-scene="ready">管理已开启</button><button data-scene="ap-failed">热点启动失败</button><button data-online="none">在线更新：无 WiFi</button><button data-online="fail">在线更新：连接失败</button><button data-online="ok">在线更新：成功</button><button data-online="drop">在线更新：短暂断连</button><button data-scene="no-sd">无 SD 卡</button></div><p class="devicehint" id="devicehint">按 OK 开启设备管理。</p><p class="devicehint">设备端文字采用 14 / 20 / 24px；二维码编码示例设备热点，预览不会开启真实热点。</p></section><section class="panel phonepanel"><div class="caption"><span>手机端 · 管理后台</span><span>模拟数据</span></div><div class="phone"><div class="phonebar"><div class="brand"><img class="brand-logo" src="openbread-logo.png" alt="OpenBread"></div><span class="badge" id="badge">等待设备</span></div><div id="phonebody" class="phonebody"></div><nav id="nav" class="nav hidden"></nav></div><p class="footnote">页面只在本地模拟，文件、固件和设置均不会发送到设备或服务器。</p></section></div></main><div id="modalbg" class="modalbg hidden"><div class="modal"><h3 id="mtitle"></h3><p id="mtext"></p><div id="mfields"></div><div class="actions"><button class="secondary" id="mcancel">取消</button><button class="primary" id="mconfirm">确认</button></div></div></div>
<script>
const screen=document.querySelector('#screen'),wrap=document.querySelector('#devicewrap'),phone=document.querySelector('#phonebody'),nav=document.querySelector('#nav'),modal=document.querySelector('#modalbg');
let dev='entry',apActive=false,connected=false,logged=false,page='overview',sd=true,onlineScenario='ok',onlineState='idle',onlineTimer=null,deviceName='OpenBread Normal One',sleep='20 秒',path=[],pending=null,firmware=null,transferTimer=null,stepTimer=null,items={'/':[{n:'music',dir:true},{n:'Font',dir:true},{n:'words',dir:true},{n:'说明.txt',size:'2 KB'}],'/music':[{n:'晴天.mp3',size:'4.2 MB'},{n:'晴天.lrc',size:'3 KB'},{n:'稻香.mp3',size:'5.1 MB'}],'/Font':[{n:'font-14.ui.bin',size:'39 KB'},{n:'font-20.ui.bin',size:'60 KB'},{n:'font-24.ui.bin',size:'69 KB'}],'/words':[]};
const deviceIcon='<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="5" width="30" height="38" rx="6"/><rect x="14" y="10" width="20" height="15" rx="2"/><path d="M18 33h12M24 30v6"/></svg>';
const miniDevice='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="1" width="10" height="14" rx="2"/><path d="M5 4h6v5H5zM6 12h4"/></svg>';
const loadingIcon='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5a19 19 0 1 1-18 13"/><path d="M6 8v10h10"/></svg>';
const warningIcon='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 7 43 39H5z"/><path d="M24 18v10M24 34h.1"/></svg>';
const doneIcon='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18"/><path d="m15 24 6 6 12-13"/></svg>';
const updateIcon='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 31V9m-9 9 9-9 9 9M10 31v8h28v-8"/></svg>';
const url='http://192.168.4.1', hotspot='OpenBread-Manage-1A2B', code='482 916';function escapeHtml(s){const e=document.createElement('div');e.textContent=String(s);return e.innerHTML}function pathKey(){return '/'+path.join('/')}function promptModal(title,description,confirm,fields='',label='确认'){document.querySelector('#mtitle').textContent=title;document.querySelector('#mtext').textContent=description;document.querySelector('#mfields').innerHTML=fields;document.querySelector('#mconfirm').textContent=label;pending=confirm;modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden');pending=null}document.querySelector('#mcancel').onclick=closeModal;document.querySelector('#mconfirm').onclick=()=>{const fn=pending;if(fn)fn()};
function stopTimers(){clearTimeout(stepTimer);clearTimeout(onlineTimer);clearInterval(transferTimer);stepTimer=onlineTimer=transferTimer=null;onlineState='idle'}
function setDev(next){dev=next;drawDevice();drawPhone()}
function drawDevice(){let names={entry:'准备开启',starting:'开启热点',ready:'热点已开启','ap-failed':'热点启动失败','no-sd':'无 SD 卡',closed:'管理已关闭',updating:'正在更新'};document.querySelector('#device-state').textContent=names[dev]||'管理已开启';let body='',footer='<span>‹ 返回</span>',hint='';
if(dev==='entry'){body='<div class="hero"><div class="symbol">' + deviceIcon + '</div><div><div class="big">设备管理</div><div class="small">开启热点，用手机管理</div></div></div>';footer+='<span><b class="keycap">OK</b>开启</span>';hint='按 OK 开启设备管理热点。'}
else if(dev==='starting'){body='<div class="hero"><div class="symbol">' + loadingIcon + '</div><div><div class="big">正在开启热点</div><div class="small">请稍候</div></div></div>';footer='<span>‹ 取消</span>';hint='正在启动设备热点与管理服务。'}
else if(dev==='ready'||dev==='no-sd'){body=`<div class="copy"><div class="medium">扫码连接设备热点</div><div class="small">${hotspot}</div><div class="small">${url}</div><div class="small">验证码 ${code}</div></div><img class="qr" src="admin_hotspot_qr.svg" alt="示例设备热点二维码">`;footer=`<span>‹ 关闭管理</span><span>${onlineState==='connecting'?'正在联网':onlineState==='checking'?'检查更新中':dev==='no-sd'?'SD 卡未插入':'热点已开启'}</span>`;hint='手机扫描设备热点二维码；连接后点击系统登录提示，或访问 192.168.4.1。';}
else if(dev==='ap-failed'){body='<div class="hero"><div class="symbol">' + warningIcon + '</div><div><div class="big">热点开启失败</div><div class="small">请重试</div></div></div>';footer+='<span><b class="keycap">OK</b>重试</span>';hint='设备热点启动失败，可按 OK 重试。'}
else if(dev==='updating'){body='<div class="hero"><div class="symbol">' + updateIcon + '</div><div><div class="big">正在更新</div><div class="small">请保持电源连接</div></div></div>';footer='<span>更新完成后自动重启</span>';hint='模拟固件更新，无法取消。'}
else{body='<div class="hero"><div class="symbol">' + doneIcon + '</div><div><div class="big">管理已关闭</div><div class="small">热点与 WiFi 已关闭</div></div></div>';footer+='<span><b class="keycap">OK</b>重新开启</span>';hint='管理服务、热点和联网 WiFi 均已关闭。'}
screen.innerHTML=`<div class="head"><span class="headleft"><span class="tinyicon">${miniDevice}</span>设备管理</span><span>${apActive?'热点':''}</span></div><div class="body">${body}</div><div class="foot">${footer}</div>`;document.querySelector('#devicehint').textContent=hint}
function key(k){if(dev==='updating')return;if(k==='left'){if(dev==='starting'){stopTimers();apActive=connected=logged=false;setDev('entry')}else if(apActive){promptModal('关闭设备管理？','关闭后手机将断开连接，热点与联网 WiFi 都会关闭。',()=>{stopTimers();apActive=connected=logged=false;closeModal();setDev('closed')},'','关闭管理')}else setDev('entry');return}if(k!=='ok')return;if(dev==='entry'||dev==='ap-failed'||dev==='closed'){apActive=connected=logged=false;setDev('starting');stepTimer=setTimeout(()=>{apActive=true;connected=false;setDev(sd?'ready':'no-sd')},800)}}

function card(title,content){return `<section class="card"><h3>${title}</h3>${content}</section>`}function info(title,value){return `<div class="tile"><span>${title}</span><strong>${value}</strong></div>`}function button(title,fn,cls='secondary'){return `<button class="${cls}" data-act="${fn}">${title}</button>`}function navHtml(){return [['overview','⌂','概览'],['files','▤','文件'],['settings','⚙','设置'],['update','↑','更新']].map(([id,ico,name])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${ico}</span>${name}</button>`).join('')}
function drawPhone(){document.querySelector('#badge').textContent=logged?'已验证':connected?'等待验证':apActive?'等待连接':'等待设备';nav.classList.toggle('hidden',!logged||!connected||onlineState==='reconnecting');nav.innerHTML=navHtml();
if(!connected){if(apActive){phone.innerHTML='<div class="overline">DEVICE HOTSPOT</div><h2>连接设备热点</h2><p class="lead">先扫描设备屏幕上的二维码，加入设备热点。</p>'+card('连接步骤',`<div class="row"><span>1　连接 ${hotspot}</span><span>›</span></div><div class="row"><span>2　点击系统登录提示</span><span>›</span></div><div class="row"><span>3　未弹出时访问 ${url}</span><span>›</span></div><p class="footnote">手机可能提示网络无法上网，请选择保持连接。</p><button class="primary wide" data-act="phone-connect">模拟手机已连接热点</button>`)}else{phone.innerHTML='<div class="overline">LOCAL DEVICE</div><h2>连接设备管理</h2><p class="lead">先在设备上开启管理热点。</p>'+card('连接步骤','<div class="row"><span>1　设备开启管理热点</span><span>›</span></div><div class="row"><span>2　手机扫码加入设备热点</span><span>›</span></div><div class="row"><span>3　输入设备验证码</span><span>›</span></div>')}return}
if(onlineState==='reconnecting'){phone.innerHTML='<div class="overline">正在重连</div><h2>连接暂时中断</h2><p class="lead">设备连接路由器时，手机可能短暂离开设备热点；正在尝试恢复连接。</p>'+card('更新状态','<p class="lead">重连后将继续显示检查进度。</p>');return}
if(!logged){phone.innerHTML='<div class="overline">设备连接</div><h2>欢迎回来</h2><p class="lead">请输入设备屏幕上显示的 6 位验证码。</p>'+card('验证设备','<label class="label" for="code">验证码</label><input id="code" inputmode="numeric" maxlength="7" placeholder="000 000"><p class="footnote">预览验证码：482 916</p><div id="loginerror"></div><button class="primary wide" data-act="login">进入管理后台</button>');return}
if(page==='overview'){phone.innerHTML=`<div class="overline">设备概览</div><h2>${escapeHtml(deviceName)}</h2><p class="lead">你的设备已连接，可以开始管理。</p>`+card('设备状态',`<div class="tilegrid">${info('固件版本','V0.1.7')}${info('电池','76%')}${info('设备热点','已开启')}${info('设备时间','14:35')}</div>`)+card('存储空间',`<div class="row"><span>SD 卡</span><strong>${sd?'3.6 GB 可用':'未插入'}</strong></div><div class="progress"><i style="width:${sd?'28':'0'}%"></i></div><p class="muted">${sd?'已使用 1.4 GB / 共 5 GB':'插入 SD 卡后可管理文件'}</p>`)+`<div class="actions">${button('管理文件','open-files','primary')}${button('设备设置','open-settings')}</div>`}
else if(page==='files'){const list=items[pathKey()]||[];phone.innerHTML=`<div class="overline">SD 卡文件</div><h2>文件管理</h2><p class="lead">浏览和传输设备上的文件。</p>`+(!sd?card('SD 卡未插入','<p class="lead">插入 SD 卡后即可浏览和上传文件。</p>'):card('当前位置',`<div class="path">SD 卡 ${path.length?' / '+path.map(escapeHtml).join(' / '):'/ '}</div><div class="actions" style="margin-top:12px">${path.length?button('返回上级','parent'):''}${button('上传文件','upload','primary')}${button('新建文件夹','mkdir')}</div>`)+card('文件',list.length?list.map((f,i)=>`<div class="row"><div class="fileleft"><span class="fileicon">${f.dir?'▣':'▤'}</span><div><div class="rowname">${escapeHtml(f.n)}</div><div class="muted">${f.dir?'文件夹':escapeHtml(f.size||'文件')}</div></div></div><div class="actions">${f.dir?`<button class="filebtn" data-open="${i}">打开</button>`:`<button class="filebtn" data-download="${i}">下载</button>`}<button class="filebtn" data-rename="${i}">改名</button><button class="filebtn" data-delete="${i}">删除</button></div></div>`).join(''):'<p class="lead">这个文件夹还是空的。</p>'))}
else if(page==='settings'){phone.innerHTML='<div class="overline">偏好设置</div><h2>设备设置</h2><p class="lead">调整设备名称与自动休眠时间。</p>'+card('基本设置',`<label class="label" for="devname">设备名称</label><input id="devname" maxlength="32" value="${escapeHtml(deviceName)}"><p class="footnote">名称显示在管理后台；不改变热点和蓝牙名称。</p><label class="label" for="sleep">自动休眠</label><select id="sleep">${['20 秒','1 分钟','5 分钟','关闭自动休眠'].map(x=>`<option ${x===sleep?'selected':''}>${x}</option>`).join('')}</select><p class="footnote">后台开启期间保持唤醒，关闭后重新开始计时。</p><label class="label" for="admin-timeout">后台无操作自动关闭</label><select id="admin-timeout"><option>10 分钟</option><option>30 分钟</option><option>不自动关闭</option></select><button class="primary wide" data-act="save-settings">保存设置</button><div id="saved"></div>`)+card('管理连接','<p class="lead">完成后可在设备上关闭管理。</p><div style="margin-top:12px">'+button('关闭设备管理','close')+'</div>')}
else if(page==='update'){phone.innerHTML='<div class="overline">软件更新</div><h2>固件更新</h2><p class="lead">当前版本 V0.1.7</p>'+card('在线更新','<p class="lead">设备将临时连接已保存的 WiFi，热点继续开启。</p><div style="margin-top:12px">'+button('检查更新','online')+'</div><div id="online-status"></div>')+card('本地固件','<p class="lead">选择 .bin 文件，上传并检查后再确认更新。</p><label class="label" for="firmware">固件文件</label><input type="file" id="firmware" accept=".bin"><div id="firmware-status"></div><div style="margin-top:12px"><button class="primary wide" data-act="firmware-upload">上传并检查</button></div>')}
}
function setProgress(container,done){let n=0;container.innerHTML='<div class="progress"><i></i></div><p class="muted" id="progress-text">准备中</p>';const bar=container.querySelector('i'),text=container.querySelector('#progress-text');clearInterval(transferTimer);transferTimer=setInterval(()=>{n=Math.min(100,n+10);bar.style.width=n+'%';text.textContent=`${n}% · 模拟传输`;if(n===100){clearInterval(transferTimer);transferTimer=null;done()}},100)}
function act(name){if(name==='phone-connect'){connected=true;drawPhone()}else if(name==='login'){const input=document.querySelector('#code').value.replace(/\s/g,'');if(input!=='482916'){document.querySelector('#loginerror').innerHTML='<div class="toast">验证码不正确，请重试。</div>';return}logged=true;page='overview';drawPhone()}else if(name==='open-files'||name==='open-settings'){page=name==='open-files'?'files':'settings';drawPhone()}else if(name==='parent'){path.pop();drawPhone()}else if(name==='save-settings'){const n=document.querySelector('#devname').value.trim();if(!n){document.querySelector('#saved').innerHTML='<div class="toast">请输入设备名称。</div>';return}deviceName=n;sleep=document.querySelector('#sleep').value;document.querySelector('#saved').innerHTML='<div class="toast">设置已保存（模拟）。</div>'}else if(name==='close')key('left');else if(name==='online')startOnlineCheck();else if(name==='configure-wifi')configureWifi();else if(name==='mkdir'){promptModal('新建文件夹','在当前目录中创建文件夹。',()=>{const n=document.querySelector('#modalname').value.trim();if(!n||n.includes('/'))return;let key=pathKey(),next=(key==='/'?'':key)+'/'+n;if((items[key]||[]).some(f=>f.n===n)){document.querySelector('#mtext').textContent='名称已存在，请换一个。';return}items[key].push({n,dir:true});items[next]=[];closeModal();drawPhone()},'<label class="label">文件夹名称</label><input id="modalname" maxlength="48">','创建')}else if(name==='upload'){promptModal('上传文件','选择要上传到当前目录的文件。',()=>{const input=document.querySelector('#uploadfile');if(!input.files.length){document.querySelector('#mtext').textContent='请先选择文件。';return}const file=input.files[0],list=items[pathKey()],existing=list.find(f=>f.n===file.name);if(existing){promptModal('文件已存在','同名文件已存在，要覆盖它吗？',()=>{closeModal();simulateUpload(file,true)},'','覆盖');return}closeModal();simulateUpload(file,false)},'<label class="label">选择文件</label><input id="uploadfile" type="file">','上传')}else if(name==='firmware-upload'){const file=document.querySelector('#firmware').files[0];if(!file||!file.name.toLowerCase().endsWith('.bin')){document.querySelector('#firmware-status').innerHTML='<div class="toast">请选择 .bin 固件文件。</div>';return}firmware=file.name;const target=document.querySelector('#firmware-status');setProgress(target,()=>{target.innerHTML=`<div class="toast">${escapeHtml(firmware)} 上传完成并通过模拟检查。</div><button class="primary wide" data-act="firmware-apply">确认更新</button>`})}else if(name==='firmware-apply'){promptModal('确认更新固件？','设备将重启进入新固件，请保持电源连接。',()=>{closeModal();setDev('updating');stepTimer=setTimeout(()=>{apActive=connected=logged=false;setDev('closed')},1600)},'','确认更新')}}
function onlineNotice(message,action=''){const target=document.querySelector('#online-status');if(target)target.innerHTML=`<div class="toast">${message}</div>${action}`}
function startOnlineCheck(){
 if(onlineTimer)return;
 if(onlineScenario==='none'){onlineState='idle';onlineNotice('没有已保存的 WiFi，请先配置网络。',button('配置 WiFi','configure-wifi'));return}
 onlineState='connecting';drawDevice();onlineNotice('设备正在连接路由器 WiFi，设备热点继续开启。');
 onlineTimer=setTimeout(()=>{onlineTimer=null;
  if(onlineScenario==='fail'){onlineState='idle';drawDevice();onlineNotice('路由器连接失败。热点仍开启，你可以重试或配置网络。',button('配置 WiFi','configure-wifi'));return}
  if(onlineScenario==='drop'){onlineState='reconnecting';drawDevice();drawPhone();onlineTimer=setTimeout(()=>{onlineTimer=null;onlineState='checking';drawDevice();drawPhone();onlineNotice('已重新连接，正在恢复更新状态…');finishOnlineCheck()},900);return}
  onlineState='checking';drawDevice();onlineNotice('路由器已连接，正在检查更新…');finishOnlineCheck();
 },900);
}
function finishOnlineCheck(){onlineTimer=setTimeout(()=>{onlineTimer=null;onlineState='idle';drawDevice();onlineNotice('当前已是最新版本。联网 WiFi 已关闭，设备热点保持开启。')},900)}
function configureWifi(){promptModal('配置 WiFi','输入路由器名称和密码；仅用于本次预览。',()=>{const ssid=document.querySelector('#wifi-ssid').value.trim();if(!ssid){document.querySelector('#mtext').textContent='请输入 WiFi 名称。';return}closeModal();onlineScenario='ok';onlineNotice('WiFi 已保存（模拟），可以重新检查更新。')},'<label class="label">WiFi 名称</label><input id="wifi-ssid" maxlength="32"><label class="label">WiFi 密码</label><input id="wifi-password" type="password" maxlength="64">','保存')}
function simulateUpload(file,replace){page='files';drawPhone();const target=document.createElement('div');phone.prepend(target);setProgress(target,()=>{const list=items[pathKey()];if(replace){const i=list.findIndex(x=>x.n===file.name);if(i>=0)list.splice(i,1)}list.push({n:file.name,size:(file.size/1024).toFixed(1)+' KB'});drawPhone();const notice=document.createElement('div');notice.className='toast';notice.textContent='上传完成（模拟）。';phone.prepend(notice)})}
document.addEventListener('click',e=>{const keyButton=e.target.closest('[data-key]');if(keyButton)key(keyButton.dataset.key);const scene=e.target.closest('[data-scene]');if(scene){stopTimers();closeModal();const s=scene.dataset.scene;sd=s!=='no-sd';apActive=s==='ready'||s==='no-sd';connected=false;logged=false;path=[];page='overview';setDev(s)}const online=e.target.closest('[data-online]');if(online){onlineScenario=online.dataset.online;document.querySelector('#devicehint').textContent='已选择在线更新模拟：'+({none:'无 WiFi',fail:'连接失败',ok:'成功',drop:'短暂断连'}[onlineScenario])}const tab=e.target.closest('[data-page]');if(tab){page=tab.dataset.page;drawPhone()}const a=e.target.closest('[data-act]');if(a)act(a.dataset.act);const open=e.target.closest('[data-open]');if(open){path.push(items[pathKey()][+open.dataset.open].n);drawPhone()}const download=e.target.closest('[data-download]');if(download){const f=items[pathKey()][+download.dataset.download];promptModal('下载文件','模拟下载：'+f.n,closeModal,'','知道了')}const rename=e.target.closest('[data-rename]');if(rename){const index=+rename.dataset.rename,entry=items[pathKey()][index];promptModal('重命名','输入新的文件名称。',()=>{let n=document.querySelector('#modalname').value.trim();if(!n||n.includes('/'))return;const list=items[pathKey()];if(list.some(f=>f!==entry&&f.n===n)){document.querySelector('#mtext').textContent='名称已存在，请换一个。';return}if(entry.dir){const base=pathKey()==='/'?'':pathKey(),oldPrefix=base+'/'+entry.n,newPrefix=base+'/'+n;for(const key of Object.keys(items).sort((a,b)=>a.length-b.length)){if(key===oldPrefix||key.startsWith(oldPrefix+'/')){items[newPrefix+key.slice(oldPrefix.length)]=items[key];delete items[key]}}}entry.n=n;closeModal();drawPhone()},`<label class="label">新名称</label><input id="modalname" maxlength="64" value="${escapeHtml(entry.n)}">`,'保存')}const del=e.target.closest('[data-delete]');if(del){const index=+del.dataset.delete,entry=items[pathKey()][index];promptModal('确认删除？',`确定删除 ${entry.n}${entry.dir?' 及其内容':''}？`,()=>{if(entry.dir){const base=pathKey()==='/'?'':pathKey(),prefix=base+'/'+entry.n;for(const key of Object.keys(items))if(key===prefix||key.startsWith(prefix+'/'))delete items[key]}items[pathKey()].splice(index,1);closeModal();drawPhone()},'','删除')}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',Enter:'ok',Escape:'left'}[e.key];if(k){e.preventDefault();key(k)}});function resize(){screen.style.transform=`scale(${wrap.clientWidth/384})`}new ResizeObserver(resize).observe(wrap);drawDevice();drawPhone();resize();
</script></body></html>
