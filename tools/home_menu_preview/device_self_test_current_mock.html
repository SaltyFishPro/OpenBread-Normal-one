<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenBread · 设备自检设计预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#efefe9;color:#252820;font:14px/1.6 'Microsoft YaHei',sans-serif}main{max-width:1200px;margin:auto;padding:38px 24px}h1{font-size:28px;font-weight:500;margin:0 0 6px}p{color:#6f7669;margin:0 0 18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}.panel{background:#fff;border:1px solid #dce0d5;border-radius:18px;padding:22px}.caption{display:flex;justify-content:space-between;color:#757d6e;margin-bottom:14px}.screen{width:100%;aspect-ratio:384/168;border:1px solid #42463e;overflow:hidden;background:white}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.keys{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0 10px}button,select{font:inherit;color:#30392d;border:1px solid #d2dacd;background:#f7f9f5;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{background:#e8eee4}button:focus-visible,select:focus-visible{outline:2px solid #607557;outline-offset:2px}#hint{text-align:center;min-height:22px;margin:10px 0 0;font-size:13px}.side h2{font-size:15px;margin:0 0 8px}.side p{font-size:12px;margin:0 0 12px}.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.shortcuts button{text-align:left;font-size:12px;padding:7px}.control{border-top:1px solid #e4e8df;margin-top:18px;padding-top:16px}.control label{display:block;margin-bottom:8px}.control select{width:100%}.note{font-size:12px;color:#788173;margin-top:16px;line-height:1.7}@media(max-width:850px){main{padding:22px 12px}.layout{grid-template-columns:1fr}.panel{padding:16px}}
</style></head><body><main><h1>设备自检 · 界面优化预览</h1><p>统一黑白视觉、清晰的检测状态和轻量切换动画。</p><div class="layout"><section class="panel"><div class="caption"><span>设备屏幕 · 384 × 168</span><span id="caption">设备自检</span></div><div class="screen"><canvas id="screen" width="384" height="168" aria-label="设备自检屏幕"></canvas></div><div class="keys"><button data-key="left">Left 返回</button><button data-key="long">长按 Left</button><button data-key="right">Right</button><button data-key="up">↑ Up</button><button data-key="down">↓ Down</button><button data-key="ok">OK 确认</button></div><p id="hint" aria-live="polite"></p></section><aside class="panel side"><h2>页面快捷入口</h2><p>可直接进入，或从列表使用设备按键浏览。</p><div class="shortcuts" id="shortcuts"></div><div class="control"><label for="condition">模拟测试结果</label><select id="condition"><option value="normal">正常 / 默认</option><option value="working">正在测试</option><option value="error">失败 / 异常</option></select><p class="note">数据、故障和测试时间均为模拟，不连接设备。网页系统字体与实机 SD 点阵字体不同，界面为设计方案，动画和系统字体与实机效果可能不同。快速自检和无线测试当前仅有入口。</p></div></aside></div></main>
<script>
'use strict';
const items=[['快速自检','检查基础硬件','汇总设备状态','不执行高耗能测试'],['屏幕测试','显示测试图案','检查坏点残影','确认方向与边界'],['按键测试','检测五个按键','检查按下与释放','识别卡键异常'],['IIC设备测试','扫描IIC总线','检查设备响应','显示发现的地址'],['RTC测试','读取实时时钟','检查时间递增','不修改当前时间'],['SD卡测试','检查插卡状态','读取容量信息','默认不写入文件'],['音频测试','播放短提示音','检查音频输出','完成后关闭音频'],['马达测试','执行一次短振动','检查马达响应','完成后立即停止'],['IMU测试','读取运动数据','检查姿态变化','识别异常固定值'],['无线测试','检查蓝牙与WiFi','显示连接状态','完成后关闭无线'],['电源测试','读取电池电量','检查MAX17048','显示LDO当前状态'],['SD字库测试','读取Font文件夹','预览三个字号','检查中文与符号']];
const patNames=['全白','全黑','边框十字','横向条纹','纵向条纹','棋盘格','文字样张','动态'];
const c=document.getElementById('screen').getContext('2d');let focus=0,view='list',pattern=0,visited=0,choice=true,buttons=new Set(),page=0,size=0,phase='idle',result='',screenResult='',condition='normal',calibrated=false,notice='',timer=0;
function rect(x,y,w,h,color='#000'){c.fillStyle=color;c.fillRect(x,y,w,h)}function stroke(x,y,w,h){c.strokeStyle='#000';c.lineWidth=1;c.strokeRect(x+.5,y+.5,w-1,h-1)}function text(s,x,y,color='#000',align='left',px=14){c.fillStyle=color;c.textAlign=align;c.textBaseline='alphabetic';c.font=`${px}px "Microsoft YaHei",sans-serif`;c.fillText(s,x,y)}function centered(s,y,color='#000',px=14){text(s,192,y,color,'center',px)}function head(s){rect(0,0,384,28);centered(s,22,'#fff')}function round(x,y,w,h,color='#000'){c.fillStyle=color;c.beginPath();c.roundRect(x,y,w,h,8);c.fill()}function footer(s){text(s,12,159)}
let focusOffset=null;
function showList(){
 text('设备自检',16,27,'#000','left',20);text(String(focus+1).padStart(2,'0')+' / 12',368,25,'#000','right');rect(16,35,352,1);
 let start=Math.floor(focus/5)*5;rect(163,43,1,97);
 const target=40+(focus-start)*21, marker=focusOffset===null?target:focusOffset;
 round(12,marker,140,20);
 for(let i=0;i<5&&start+i<items.length;i++){
  let index=start+i,y=40+i*21,label=items[index][0];
  text(label,24,y+15);
  c.save();c.beginPath();c.roundRect(12,marker,140,20,8);c.clip();text(label,24,y+15,'#fff');c.restore();
 }
 text('检测说明',181,57);items[focus].slice(1).forEach((v,i)=>text(v,181,80+i*22));rect(16,146,352,1);text('↑↓ 选择',16,162);text('OK 进入',368,162,'#000','right');
}
function patterns(){if(pattern===1)rect(0,0,384,168);if(pattern===2){stroke(0,0,384,168);rect(0,84,384,1);rect(192,0,1,168)}if(pattern===3)for(let y=0;y<168;y+=8)rect(0,y,384,4);if(pattern===4)for(let x=0;x<384;x+=8)rect(x,0,4,168);if(pattern===5)for(let y=0;y<168;y+=16)for(let x=0;x<384;x+=16)if((x/16+y/16)%2===0)rect(x,y,16,16);if(pattern===6){stroke(0,0,384,168);['中文显示：设备屏幕测试','数字：0123456789','符号：+-*/!?  @#','检查文字、边界与方向'].forEach((s,i)=>text(s,24,38+i*32))}if(pattern===7){let x=(Date.now()/8)%684;x=x>342?684-x:x;let y=(Date.now()/11)%208;y=y>104?208-y:y;rect(x,y,42,42);rect(x+8,y+8,26,26,'#fff')}let bg=pattern===1?'#000':'#fff',fg=pattern===1?'#fff':'#000';rect(0,146,384,22,bg);text(`${pattern+1}/8 ${patNames[pattern]}  Up/Down切换`,8,163,fg);if(pattern===7)text('FPS:—',376,163,fg,'right')}
function choices(question,labels,top,bottom,base){centered(question,top===79?52:109);let x=80,y=top;rect(choice?x:x+128,y,96,bottom-y+1);text(labels[0],x+48,base,choice?'#fff':'#000','center');text(labels[1],x+176,base,choice?'#000':'#fff','center')}
function drawTop(title,tag='设备自检'){text(title,16,26,'#000','left',20);text(tag,368,24,'#000','right');rect(16,34,352,1)}
function bottom(left,right=''){rect(16,145,352,1);text(left,16,162);if(right)text(right,368,162,'#000','right')}
function chip(label,y=43){round(16,y,Math.min(336,c.measureText(label).width+25),23);text(label,28,y+17,'#fff')}
function option(question,labels){text(question,24,103);for(let i=0;i<2;i++){let x=192+i*82,sel=(i===0)===choice;if(sel)round(x,85,72,25);else stroke(x,85,72,25);text(labels[i],x+36,103,sel?'#fff':'#000','center')}}
function stat(label,value,y){text(label,24,y);text(value,352,y,'#000','right');rect(24,y+8,328,1)}
function buttonPage(){drawTop('按键测试','按下并释放');['Left','Right','Up','Down','OK'].forEach((name,i)=>{let x=16+i*71,done=buttons.has(name);if(done)round(x,47,64,59);else stroke(x,47,64,59);text(name,x+32,70,done?'#fff':'#000','center');text(done?'已通过':'待测试',x+32,94,done?'#fff':'#000','center')});text(buttons.size===5?'全部按键通过':'依次按下并释放全部按键',24,133);bottom('长按 Left 取消',buttons.size===5?'OK 返回':'')}
function draw(){rect(0,0,384,168,'#fff');let err=condition==='error',working=condition==='working';
 if(view==='list')showList();
 else if(view==='screenIntro'){drawTop('屏幕测试','01 / 08');chip('检查坏点、残影和显示方向');text('依次查看 8 种全屏测试图案',24,94);text('全部查看后，确认屏幕显示是否正常',24,119);bottom('← 返回','OK 开始')}
 else if(view==='pattern')patterns();
 else if(view==='screenConfirm'){drawTop('屏幕测试','完成检查');chip('8 种图案已查看');option('屏幕显示正常吗？',['正常','异常']);bottom('↑↓ 选择','OK 确认')}
 else if(view==='button')buttonPage();
 else if(view==='iic'){drawTop('IIC 设备测试','总线扫描');chip(err?'总线初始化失败':working?'正在扫描 0x36 / 0x77':'扫描完成 · 发现 3 个设备');text('发现地址',24,91);text(err?'—':working?'扫描中…':'0x36     0x51     0x6A',24,119);bottom('← 返回','OK 重新扫描')}
 else if(view==='rtc'){drawTop('RTC 测试',`${page+1} / 2`);chip(err?'RTC 设备不可用':working?'正在等待时间递增':'走时与省电配置正常');if(!page){stat('当前时间','10:28:35',94);stat('当前日期','2026-11-22',128)}else{text('Control1  0x00     Control2  0x07',24,90);text('Offset  0x00       建议项  0',24,116);text('CLKOUT 与定时器已关闭',24,138)}bottom('↑↓ 翻页  ← 返回','OK 重测')}
 else if(view==='sd'){drawTop('SD 卡测试','只读检查');chip(err?'未检测到 SD 卡':'只读测试通过');stat('总容量',err?'—':'3840 MB',94);stat('可用容量',err?'—':'3120 MB',128);bottom('← 返回','OK 重试')}
 else if(view==='audio'||view==='motor'){let audio=view==='audio',active=phase==='working',waiting=phase==='confirm';drawTop(audio?'音频测试':'马达测试',audio?'扬声器':'DRV2605L');let status=phase==='done'?(result==='yes'?'测试通过':'未确认，请重试'):active?(audio?'正在播放提示音':'正在振动'):waiting?(audio?'提示音播放结束':'振动已结束'):err?(audio?'音频初始化失败':'马达芯片无响应'):(audio?'按 OK 播放提示音':'按 OK 执行短振动');chip(status);if(waiting)option(audio?'听到提示音了吗？':'感觉到振动了吗？',['是','否']);else {text(audio?'1 kHz · 500 ms · 固定低音量':'300 ms · 完成后自动停止',24,101);text(phase==='done'?'可再次测试，或返回列表':audio?'请留意设备声音':'请手持设备感受振动',24,128)}bottom(waiting?'↑↓ 选择  ← 返回':'← 返回',waiting?'OK 确认':active?'正在测试':'OK '+(phase==='done'?'重测':audio?'播放':'振动'))}
 else if(view==='imu'){drawTop('IMU 测试',`${page+1} / 3`);if(page===0){chip(err?'测试失败，请按 OK 重试':working?'正在开启传感器':'持续检测中，请轻晃设备');stat('设备地址','0x6A',94);stat('芯片标识','0x05',128)}else if(page===1){text('加速度',24,62);text('X   22        Y  -13        Z  4092',24,87);rect(24,96,328,1);text('陀螺仪',24,116);text('X    4        Y    0        Z     -2',24,138)}else{stroke(171,56,42,42);rect(176,61,32,32);text(calibrated?'已校准，倾转设备查看方框移动':'放正设备后按 OK 校准',192,128,'#000','center')}bottom('↑↓ 翻页  ← 返回',page===2?'OK 校准':'OK 重测')}
 else if(view==='power'){drawTop('电源测试',`${page+1} / 2`);if(page===0){chip(err?'MAX17048 通信失败':'电池状态正常');stat('剩余电量','82.38%  ·  约 659 mAh',94);stat('电池电压','4120 mV',128)}else{stat('变化率','-1.02% / h',61);stat('估算电流','-8.1 mA',88);stat('音频 / 传感器 LDO','关闭 / 开启',115);text('版本 0x0012   状态 0x0000',24,140)}bottom('↑↓ 翻页  ← 返回','OK 重测')}
 else if(view==='font'){drawTop('SD 字库测试','Font /');[14,20,24].forEach((n,i)=>{let x=16+i*85;if(i===size)round(x,42,76,22);else stroke(x,42,76,22);text(`${n} px`,x+38,58,i===size?'#fff':'#000','center')});if(err||working){text(err?'找不到对应字号的字库':'正在检查字库，请稍候',24,96);text('字库请放入 Font 文件夹',24,124)}else{let px=[14,20,24][size];text('你好，面包！Normal',24,94,'#000','left',px);text('0123456789 Aa',24,126,'#000','left',px)}bottom('↑↓ 字号  ← 返回','OK 重试')}
 document.getElementById('caption').textContent=view==='list'?'设备自检列表':items[focus][0]+(view==='pattern'?` · ${pattern+1}/8`:['rtc','imu','power'].includes(view)?` · ${page+1}/${view==='imu'?3:2}`:'');document.getElementById('hint').textContent=notice||({list:'上下选择测试项目，OK 进入。',screenIntro:'OK 开始测试，Left 返回。',pattern:'上下切换八个图案，全部查看后 OK 确认。',screenConfirm:'上下选择结果，OK 确认。',button:'依次点击五个按键；长按 Left 取消。',iic:'OK 重新扫描，Left 返回。',rtc:'上下翻页，OK 重测。',sd:'OK 重试，Left 返回。',audio:'OK 播放后选择是否听到。',motor:'OK 振动后选择是否感觉到。',imu:'上下翻页，第三页 OK 校准。',power:'上下翻页，OK 重测。',font:'上下切换字号，OK 重试。'}[view]);}
function enter(index){focus=index;notice='';page=0;phase='idle';result='';choice=true;calibrated=false;buttons.clear();clearTimeout(timer);let views={1:'screenIntro',2:'button',3:'iic',4:'rtc',5:'sd',6:'audio',7:'motor',8:'imu',10:'power',11:'font'};if(!views[index]){view='list';notice=`「${items[index][0]}」当前仅有列表入口，按 OK 不进入。`;draw();return}view=views[index];draw()}
function key(k){notice='';if(view==='list'){if(k==='up')focus=(focus+11)%12;if(k==='down')focus=(focus+1)%12;if(k==='ok'){enter(focus);return}if(k==='left'||k==='long')notice='已位于自检列表，实机返回设置菜单。'}else if(view==='button'){if(k==='long'){view='list'}else{let name={left:'Left',right:'Right',up:'Up',down:'Down',ok:'OK'}[k];if(name){if(buttons.size===5&&k==='ok')view='list';else buttons.add(name)}}}else if(k==='left'||k==='long'){clearTimeout(timer);view='list'}else if(view==='screenIntro'){if(k==='ok'){view='pattern';pattern=0;visited=1}}else if(view==='pattern'){if(k==='up'||k==='down'){pattern=(pattern+(k==='up'?7:1))%8;visited|=1<<pattern}if(k==='ok'){if(visited===255){view='screenConfirm';choice=true}else notice='请先查看全部八种图案。'}}else if(view==='screenConfirm'){if(k==='up'||k==='down')choice=!choice;if(k==='ok'){screenResult=choice?'通过':'异常';view='list'}}else if(view==='rtc'||view==='power'){if(k==='up'||k==='down')page=1-page;if(k==='ok')notice='已模拟重新测试。'}else if(view==='imu'){if(k==='up'||k==='down')page=(page+1)%3;if(k==='ok'){if(page===2)calibrated=true;else notice='已模拟重新测试。'}}else if(view==='font'){if(k==='up')size=(size+2)%3;if(k==='down')size=(size+1)%3;if(k==='ok')notice='已模拟重试。'}else if(view==='audio'||view==='motor'){if(phase==='confirm'){if(k==='up'||k==='down')choice=!choice;if(k==='ok'){result=choice?'yes':'no';phase='done'}}else if(k==='ok'&&phase!=='working'){if(condition==='error'){phase='idle';notice='模拟启动失败；可调整右侧结果后重试。'}else{phase='working';draw();timer=setTimeout(()=>{phase='confirm';draw()},700);return}}}else if(k==='ok')notice='已模拟重新检查。';draw()}
const reduced=matchMedia('(prefers-reduced-motion: reduce)');let animId=0;
function transition(action,direction=1){
 cancelAnimationFrame(animId);focusOffset=null;
 const oldView=view,oldFocus=focus;
 action();
 if(reduced.matches||oldView!=='list'||view!=='list'||oldFocus===focus||Math.floor(oldFocus/5)!==Math.floor(focus/5))return;
 const from=40+(oldFocus%5)*21,to=40+(focus%5)*21,start=performance.now();
 function frame(now){const t=Math.min(1,(now-start)/180),e=1-Math.pow(1-t,3);focusOffset=from+(to-from)*e;draw();if(t<1)animId=requestAnimationFrame(frame);else{focusOffset=null;draw()}}
 animId=requestAnimationFrame(frame);
}
const shortcuts=document.getElementById('shortcuts');items.forEach((item,i)=>{let b=document.createElement('button');b.textContent=item[0];b.onclick=()=>transition(()=>enter(i));shortcuts.appendChild(b)});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>transition(()=>key(b.dataset.key),b.dataset.key==='up'||b.dataset.key==='left'||b.dataset.key==='long'?-1:1));document.getElementById('condition').onchange=e=>{condition=e.target.value;notice='';draw()};document.addEventListener('keydown',e=>{if(e.target.matches('select,input'))return;let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'ok',Escape:'long'}[e.key];if(k){e.preventDefault();transition(()=>key(k),k==='up'||k==='left'||k==='long'?-1:1)}});function animate(){if(view==='pattern'&&pattern===7)draw();requestAnimationFrame(animate)}draw();requestAnimationFrame(animate);
</script></body></html>
