<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenBread · 音乐列表设计预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f2ed;color:#252922;font:14px 'Microsoft YaHei',sans-serif}main{max-width:1100px;margin:auto;padding:38px 24px}h1{font-size:28px;margin:0 0 9px}p{color:#6a7366;line-height:1.7;margin:0 0 20px}.layout{display:grid;grid-template-columns:minmax(0,820px) 230px;gap:20px}.box,aside{background:white;border:1px solid #dce1d6;border-radius:18px;padding:22px}.caption{display:flex;justify-content:space-between;font-size:12px;color:#778072;margin-bottom:15px}.wrap{width:100%;aspect-ratio:384/168;background:white;border:1px solid #cfd5cc;overflow:hidden}canvas{width:100%;height:100%;image-rendering:pixelated;display:block}.keys{display:flex;gap:8px;justify-content:center;margin:22px 0 10px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #d3dacd;background:#f6f8f4;color:#364233;border-radius:8px;padding:9px 15px}button:hover{background:#e6ece2}button:focus-visible{outline:2px solid #526b4b;outline-offset:2px}.hint{text-align:center;min-height:22px;margin:8px 0 0;font-size:13px}aside h2{font-size:16px;margin:0 0 8px}aside p{font-size:12px}.scenarios{display:grid;gap:8px}.scenarios button{text-align:left}small{display:block;color:#788173;margin-top:18px;line-height:1.7}@media(max-width:800px){main{padding:24px 14px}.layout{grid-template-columns:1fr}.box,aside{padding:16px}}
</style></head><body><main><h1>音乐列表 · 新方案</h1><p>白底歌曲列表、清晰的播放状态和简洁操作栏。</p><div class="layout"><section class="box"><div class="caption"><span>设备屏幕 · 384 × 168</span><span id="view">音乐列表</span></div><div class="wrap"><canvas id="screen" width="384" height="168"></canvas></div><div class="keys"><button data-key="left">← 左</button><button data-key="right">→ 右</button><button data-key="up">↑ 上</button><button data-key="down">↓ 下</button><button data-key="ok">OK 确认</button><button data-key="long">长按 Left</button></div><p class="hint" id="hint">上下选择歌曲，OK 播放；右键进入工具，左键返回。</p></section><aside><h2>预览场景</h2><p>歌曲名称、收藏、音量和播放进度为模拟数据，刷新页面后不会保存。</p><div class="scenarios"><button data-state="ready">歌曲列表</button><button data-state="scanning">正在扫描</button><button data-state="font">加载字体</button><button data-state="empty">没有音乐文件</button><button data-state="missing">SD 卡未插入</button><button data-state="error">SD 卡读取失败</button><button data-state="fontError">字体加载失败</button></div><small>音乐名称与进度为示例；屏幕文字使用 14 / 20 / 24px 方案。播放器里的时长和进度为模拟，最终效果以设备绘制为准。</small></aside></div></main>
<script>
const ICONS={"music_nav_icon_music": [0, 248, 1, 128, 255, 3, 224, 3, 3, 96, 128, 3, 48, 252, 3, 240, 63, 3, 240, 0, 3, 48, 0, 3, 48, 0, 3, 48, 0, 3, 48, 224, 3, 48, 48, 3, 62, 16, 3, 63, 48, 3, 51, 240, 1, 51, 192, 0, 63, 0, 0, 30, 0, 0], "music_nav_icon_favorite_outline": [0, 0, 0, 124, 120, 0, 254, 255, 1, 134, 135, 1, 3, 3, 3, 3, 1, 3, 3, 0, 3, 3, 0, 3, 3, 128, 3, 6, 128, 1, 14, 192, 1, 28, 224, 0, 56, 112, 0, 112, 56, 0, 224, 28, 0, 192, 15, 0, 0, 3, 0, 0, 0, 0], "music_nav_icon_favorite_filled": [0, 0, 0, 124, 120, 0, 254, 255, 1, 254, 255, 1, 255, 255, 3, 255, 255, 3, 255, 255, 3, 255, 255, 3, 255, 255, 3, 254, 255, 1, 254, 255, 1, 252, 255, 0, 248, 127, 0, 240, 63, 0, 224, 31, 0, 192, 15, 0, 0, 3, 0, 0, 0, 0], "music_nav_icon_volume": [0, 0, 0, 0, 0, 0, 192, 64, 0, 224, 192, 0, 240, 196, 1, 240, 140, 1, 254, 156, 3, 255, 24, 3, 255, 24, 3, 255, 24, 3, 255, 24, 3, 254, 140, 3, 240, 140, 1, 224, 192, 1, 224, 192, 0, 192, 0, 0, 0, 0, 0, 0, 0, 0], "music_nav_icon_info": [192, 15, 0, 240, 63, 0, 248, 127, 0, 252, 255, 0, 254, 252, 1, 254, 252, 1, 255, 255, 3, 255, 255, 3, 127, 252, 3, 127, 252, 3, 255, 252, 3, 255, 252, 3, 254, 240, 1, 254, 248, 1, 252, 255, 0, 248, 127, 0, 240, 63, 0, 192, 15, 0], "music_player_icon_play": [224, 31, 0, 240, 63, 0, 252, 127, 0, 252, 255, 0, 254, 255, 1, 63, 255, 1, 63, 252, 3, 63, 240, 3, 63, 224, 3, 63, 224, 3, 63, 240, 3, 63, 252, 3, 127, 255, 1, 254, 255, 1, 252, 255, 0, 248, 127, 0, 240, 63, 0, 192, 15, 0], "music_player_icon_pause": [126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 126, 248, 1, 62, 248, 1], "music_player_icon_shuffle": [0, 0, 0, 0, 192, 0, 0, 192, 1, 3, 192, 3, 15, 248, 3, 63, 252, 3, 112, 206, 1, 224, 199, 0, 192, 3, 0, 192, 1, 0, 224, 198, 0, 120, 206, 1, 63, 252, 3, 15, 248, 3, 0, 128, 3, 0, 192, 1, 0, 192, 0, 0, 0, 0], "music_player_icon_sequential": [224, 159, 1, 240, 255, 1, 60, 240, 1, 12, 248, 1, 6, 248, 1, 7, 248, 0, 3, 0, 0, 3, 0, 0, 3, 0, 0, 3, 0, 3, 3, 0, 3, 3, 0, 3, 7, 128, 3, 6, 192, 1, 12, 224, 0, 60, 112, 0, 240, 63, 0, 224, 31, 0], "music_player_icon_previous": [6, 0, 0, 14, 16, 0, 14, 124, 0, 14, 255, 0, 206, 239, 0, 246, 227, 0, 254, 224, 0, 62, 224, 0, 30, 224, 0, 30, 224, 0, 126, 224, 0, 254, 224, 0, 230, 227, 0, 206, 239, 0, 14, 255, 0, 14, 124, 0, 14, 0, 0, 6, 0, 0], "music_player_icon_next": [0, 224, 0, 16, 224, 0, 124, 224, 0, 254, 225, 0, 238, 231, 0, 142, 239, 0, 14, 254, 0, 14, 248, 0, 14, 240, 0, 14, 240, 0, 14, 252, 0, 14, 254, 0, 142, 239, 0, 238, 231, 0, 254, 225, 0, 124, 224, 0, 0, 224, 0, 0, 192, 0]};const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d'),hint=document.querySelector('#hint');const songs=['夜空中最亮的星.mp3','晴天.mp3','稻香.mp3','平凡之路.mp3','海阔天空.mp3','一路向北.mp3','那些年.mp3','A Long Song Title For Scrolling Preview.mp3'];let state='ready',tab=0,index=0,playingIndex=-1,player=false,control=0,volume=12,popup=false,playing=false,shuffle=false,favorites=new Set(),seconds=42,focus='list',scrollStart=performance.now();
function rect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function icon(name,x,y,color){const a=ICONS[name];if(!a)return;ctx.fillStyle=color;for(let j=0;j<18;j++)for(let i=0;i<18;i++)if(a[j*3+(i>>3)]&(1<<(i%8)))ctx.fillRect(x+i,y+j,1,1)}function txt(t,x,y,color='#000',font='14px "Microsoft YaHei"'){ctx.fillStyle=color;ctx.font=font;ctx.textBaseline='alphabetic';ctx.fillText(t,x,y)}function center(t,y){ctx.font='14px "Microsoft YaHei"';txt(t,(384-ctx.measureText(t).width)/2,y)}
function shortName(name){return name.replace(/\.mp3$/i,'')}
function list(){
 ctx.fillStyle='#fff';ctx.fillRect(0,0,384,168);
 txt('音乐',16,22,'#000','20px "Microsoft YaHei"');
 ctx.font='14px "Microsoft YaHei"';const count=state==='ready'?`${songs.length} 首`:'音乐列表';txt(count,368-ctx.measureText(count).width,21);
 ctx.fillStyle='#000';ctx.fillRect(16,29,352,1);
 const messages={scanning:'正在扫描音乐...',font:'正在加载音乐列表...',empty:'未找到音乐文件',missing:'SD卡未插入',error:'SD卡读取失败',fontError:'字体加载失败'};
 if(state!=='ready'){center(messages[state],77);if(state==='fontError')center('OK 重试  Left 返回',103)}else{
   const start=Math.floor(index/3)*3;
   for(let row=0;row<3 && start+row<songs.length;row++){
    const j=start+row,y=35+row*30,selected=j===index,color=selected?'#fff':'#000';
    if(selected)rect(16,y,352,27,13,'#000');
    ctx.save();ctx.beginPath();ctx.rect(28,y+2,292,23);ctx.clip();
    ctx.font='14px "Microsoft YaHei"';const name=shortName(songs[j]);const available=286;const overflow=Math.max(0,ctx.measureText(name).width-available);
    let offset=0;if(selected&&overflow){const elapsed=Math.max(0,performance.now()-scrollStart-1000);offset=Math.min(overflow,Math.max(0,(elapsed%((overflow+30)*70+1800))/70));}
    if(!selected&&overflow){let cut=name;while(cut&&ctx.measureText(cut+'...').width>available)cut=Array.from(cut).slice(0,-1).join('');txt(cut+'...',28,y+19,color)}else txt(name,28-offset,y+19,color);
    ctx.restore();
    if(j===playingIndex){txt(playing?'♫':'Ⅱ',330,y+19,color)}else if(selected){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(338,y+9);ctx.lineTo(338,y+19);ctx.lineTo(345,y+14);ctx.closePath();ctx.fill()}
   }
 }
 nav();
 if(popup){ctx.fillStyle='#fff';ctx.fillRect(58,41,268,86);ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(58.5,41.5,267,85);center('音量',64);center(Math.round(volume*100/21)+'%',90);center('上/下 调节  OK 返回',115)}
}
function nav(){
 ctx.fillStyle='#000';ctx.fillRect(16,128,352,1);
 if(focus==='tools'){
  txt('‹ 返回列表',16,153);
  for(let i=0;i<2;i++){
   let x=175+i*91,label=i===0?(favorites.has(index)?'已收藏':'收藏'):'音量';
   if(tab===i)rect(x,134,82,25,12,'#000');
   ctx.font='14px "Microsoft YaHei"';txt(label,x+(82-ctx.measureText(label).width)/2,152,tab===i?'#fff':'#000');
  }
 }else{txt('‹ 返回',16,153);txt('→ 工具',165,153);txt('OK 播放',291,153)}
}
function renderPlayer(){
 ctx.fillStyle='#fff';ctx.fillRect(0,0,384,168);
 txt('正在播放',16,22,'#000','14px "Microsoft YaHei"');
 ctx.font='14px "Microsoft YaHei"';const mode=playing?'播放中':'已暂停';txt(mode,368-ctx.measureText(mode).width,22);
 ctx.fillStyle='#000';ctx.fillRect(16,29,352,1);
 ctx.save();ctx.beginPath();ctx.rect(16,36,352,32);ctx.clip();
 ctx.font='20px "Microsoft YaHei"';const name=shortName(songs[playingIndex]);
 const overflow=Math.max(0,ctx.measureText(name).width-352);let offset=0;
 if(overflow){const elapsed=Math.max(0,performance.now()-scrollStart-1000);offset=Math.min(overflow,(elapsed%((overflow+30)*70+1800))/70)}
 txt(name,16-offset,58,'#000','20px "Microsoft YaHei"');ctx.restore();
 txt(shuffle?'随机播放':'顺序播放',16,79);
 ctx.fillStyle='#000';ctx.fillRect(16,88,352,2);ctx.fillRect(16,87,Math.floor(352*seconds/240),4);
 const formatTime=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
 txt(formatTime(seconds),16,108);ctx.font='14px "Microsoft YaHei"';txt('04:00',368-ctx.measureText('04:00').width,108);
 const labels=[playing?'暂停':'播放',shuffle?'随机':'顺序','上一首','下一首'];
 for(let i=0;i<4;i++){const x=16+i*89,w=82;if(i===control)rect(x,115,w,27,13,'#000');ctx.font='14px "Microsoft YaHei"';txt(labels[i],x+(w-ctx.measureText(labels[i]).width)/2,134,i===control?'#fff':'#000')}
 txt('‹ 返回列表',16,162);ctx.font='14px "Microsoft YaHei"';const keys='上下 选择  OK 确认';txt(keys,368-ctx.measureText(keys).width,162);
}
function draw(){document.querySelector('#view').textContent=player?'播放器':'音乐列表';player?renderPlayer():list()}
function key(k){
 if(k==='long'){player=false;popup=false;focus='list';hint.textContent='已返回主菜单（模拟）';draw();return}
 if(popup){if(k==='left'||k==='ok')popup=false;else if(k==='up')volume=Math.min(21,volume+1);else if(k==='down')volume=Math.max(0,volume-1);draw();return}
 if(player){if(k==='left'){player=false;focus='list';hint.textContent='已返回列表，♫ 标记当前播放歌曲。'}else if(k==='up')control=(control+3)%4;else if(k==='down')control=(control+1)%4;else if(k==='ok'){if(control===0)playing=!playing;else if(control===1)shuffle=!shuffle;else{playingIndex=(playingIndex+(control===2?-1:1)+songs.length)%songs.length;index=playingIndex;seconds=0;scrollStart=performance.now()}}draw();return}
 if(k==='left'){if(focus==='tools'){focus='list';hint.textContent='上下选择歌曲，OK 播放；右键进入工具。'}else hint.textContent='返回主菜单（模拟）'}
 else if(k==='right'){focus='tools';hint.textContent='上下切换收藏和音量，OK 确认，Left 返回列表。'}
 else if(k==='up'||k==='down'){if(focus==='tools')tab=tab===0?1:0;else if(state==='ready'){index=Math.max(0,Math.min(songs.length-1,index+(k==='up'?-1:1)));scrollStart=performance.now()}}
 else if(k==='ok'){
  if(state==='fontError'){state='font';hint.textContent='正在重试（模拟）'}
  else if(focus==='tools'&&tab===1)popup=true;
  else if(focus==='tools'&&state==='ready'){favorites.has(index)?favorites.delete(index):favorites.add(index)}
  else if(state==='ready'){playingIndex=index;playing=true;player=true;control=0;seconds=0;scrollStart=performance.now();hint.textContent='播放器：上下选择控制项，OK 操作，Left 返回列表。'}
 }draw();
}
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>key(b.dataset.key)));document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{state=b.dataset.state;player=false;popup=false;hint.textContent='上下选择歌曲，OK 播放；右键进入工具，左键返回。';draw()}));document.addEventListener('keydown',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'ok',Escape:'long'}[e.key];if(k){e.preventDefault();if(!e.repeat)key(k)}});draw();function tick(){if(player||(state==='ready'&&ctx.measureText(shortName(songs[index])).width>286))draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);setInterval(()=>{if(playing&&playingIndex>=0){seconds++;if(seconds>=240){seconds=0;playingIndex=(playingIndex+1)%songs.length;index=playingIndex;scrollStart=performance.now()}if(player)draw()}},1000);
</script></body></html>
