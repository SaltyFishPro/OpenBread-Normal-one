<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenBread 主菜单重构 Mock</title>
<style>
  /* 页面只是展示环境；产品屏幕本身严格只有黑与白。 */
  :root { --s: 2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e8e8e8;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 28px 16px 40px;
    color: #111; font-size: 14px;
  }
  .topbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .topbar button {
    border: 1px solid #111; background: #fff; color: #111;
    padding: 8px 18px; font-size: 14px; cursor: pointer;
  }
  .topbar button.active { background: #111; color: #fff; }
  .hint { font-size: 14px; color: #555; text-align: center; max-width: 768px; line-height: 1.7; }
  .stage { zoom: var(--s); outline: 1px solid #999; background: #fff; }
  .screen {
    --sleep-offset: 0px;
    width: 384px; height: 168px; background: #fff; position: relative;
    overflow: hidden; font-family: "Microsoft YaHei", sans-serif;
    font-size: 14px; font-weight: 400;
    -webkit-font-smoothing: none;
  }
  [hidden] { display: none !important; }
  .screen, .screen * { color: #000; }
  /* 同步平移：扫描线始终领先信息区，菜单始终在扫描线右侧。 */
  .info-col, .divider, .wheel, .toc, .ruler { transform: translateX(var(--sleep-offset)); }
  .pet-slot { position: absolute; inset: 0 auto 0 0; width: 256px; pointer-events: none; }

  /* ---------- 左信息区 ---------- */
  .info-col { position: absolute; left: 0; top: 0; width: 128px; height: 168px; }
  .divider { position: absolute; left: 128px; top: 12px; bottom: 12px; width: 1px; background: #000; }
  .time-card {
    position: absolute; left: 8px; top: 16px; width: 112px; height: 44px;
    border: 2px solid #000; border-radius: 8px; display: flex; align-items: center;
    justify-content: center;
  }
  .time-text {
    font-family: Consolas, monospace; font-size: 24px;
    line-height: 28px; font-variant-numeric: tabular-nums;
  }
  .date-card {
    position: absolute; left: 8px; top: 72px; width: 112px; height: 64px;
    border: 2px solid #000; border-radius: 8px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 28px 18px;
    gap: 4px 8px; padding: 5px 8px; align-items: center;
  }
  .date-day {
    font-family: Consolas, monospace; font-size: 24px; line-height: 28px;
  }
  .date-week {
    background: #000; color: #fff !important; font-size: 14px; line-height: 22px;
    text-align: center;
  }
  .date-month { grid-column: 2; grid-row: 2; font-size: 14px; line-height: 18px; text-align: center; }
  .date-year { grid-column: 1; grid-row: 2; font-size: 14px; line-height: 18px; }
  .battery { position: absolute; left: 16px; top: 146px; height: 18px; display: flex; gap: 8px; align-items: center; }
  .batt-body {
    width: 24px; height: 12px; border: 1px solid #000; position: relative;
  }
  .batt-body::after { content: ""; position: absolute; right: -4px; top: 3px; width: 3px; height: 5px; background: #000; }
  .batt-fill { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 16px; background: #000; }
  .batt-text { font-size: 14px; line-height: 18px; }

  /* ---------- 方案 A：焦点舞台 ---------- */
  /* 卡片 x=144..364，y=52..116；42px 实际图标后剩余 144px 文字区。 */
  .wheel { position: absolute; left: 144px; top: 52px; width: 220px; height: 64px; }
  .focus-card {
    position: relative; width: 220px; height: 64px; background: #000; color: #fff !important;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    animation: card-rise .3s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes card-rise {
    from { transform: translateY(10px); }
    to { transform: translateY(0); }
  }
  .focus-card .fbody { flex: 1; min-width: 0; color: #fff !important; }
  .focus-card .fbody .zh {
    font-size: 20px; line-height: 28px; white-space: nowrap; color: #fff !important;
    animation: text-in .22s .12s both;
  }
  @keyframes text-in {
    from { transform: translateX(-10px); }
    to { transform: translateX(0); }
  }
  .menu-icon { width: 42px; height: 42px; flex: 0 0 42px; image-rendering: pixelated; }
  /* 四角缺口取景框 */
  .tick { position: absolute; width: 8px; height: 8px; background: transparent; }
  .tick::before, .tick::after { content: ""; position: absolute; background: #000; }
  .tick.tl { left: -5px; top: -5px; } .tick.tl::before { left: 0; top: 0; width: 8px; height: 1.5px; }
  .tick.tl::after { left: 0; top: 0; width: 1.5px; height: 8px; }
  .tick.tr { right: -5px; top: -5px; } .tick.tr::before { right: 0; top: 0; width: 8px; height: 1.5px; }
  .tick.tr::after { right: 0; top: 0; width: 1.5px; height: 8px; }
  .tick.bl { left: -5px; bottom: -5px; } .tick.bl::before { left: 0; bottom: 0; width: 8px; height: 1.5px; }
  .tick.bl::after { left: 0; bottom: 0; width: 1.5px; height: 8px; }
  .tick.br { right: -5px; bottom: -5px; } .tick.br::before { right: 0; bottom: 0; width: 8px; height: 1.5px; }
  .tick.br::after { right: 0; bottom: 0; width: 1.5px; height: 8px; }

  /* 右侧 13 格位置刻度 */
  .ruler { position: absolute; right: 3px; top: 10px; bottom: 10px; width: 4px; display: flex; flex-direction: column; justify-content: space-between; }
  .ruler div { width: 2px; height: 10px; position: relative; }
  .ruler div::after { content: ""; position: absolute; top: 3px; width: 2px; height: 4px; background: #000; }
  .ruler div.active::after { top: 0; width: 4px; height: 10px; }

  /* ---------- 方案 B：杂志目录 ---------- */
  .toc { position: absolute; left: 140px; right: 20px; top: 10px; height: 148px; }
  .toc-row {
    position: absolute; left: 0; width: 100%; height: 28px; top: 0;
    display: flex; align-items: center; gap: 8px; padding: 0 8px;
  }
  .toc-row .idx {
    font-family: Consolas, monospace; font-size: 14px; line-height: 18px;
    flex: 0 0 22px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .toc-row .name { font-size: 20px; line-height: 28px; white-space: nowrap; flex-shrink: 0; }
  .toc-row .rule { flex: 1; height: 1px; background: #000; }
  .toc-row.focus { background: #000; }
  .toc-row.focus .idx, .toc-row.focus .name { color: #fff !important; }
  .toc-row.focus .rule { background: #fff; }
  .toc-row:not(.focus) { border-bottom: 1px solid #000; }

  .keys { display: flex; gap: 10px; width: min(100%, 416px); }
  .keys button {
    flex: 1; min-width: 0; padding: 10px 0; border: 1px solid #111; background: #fff; color: #111;
    font-size: 14px; cursor: pointer;
  }
  .note { max-width: 768px; font-size: 14px; color: #555; text-align: center; line-height: 1.7; }
  .power-preview { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; font-size: 14px; }
  .power-preview button { padding: 8px 14px; border: 1px solid #111; background: #fff; font-size: 14px; cursor: pointer; }
  .power-preview button:disabled { cursor: default; opacity: .5; }
  @media (prefers-reduced-motion: reduce) { .focus-card, .focus-card .zh { animation: none; } }
</style>
</head>
<body>
<div class="topbar">
  <button id="tab-a" class="active" type="button">A · 焦点舞台</button>
  <button id="tab-b" type="button">B · 杂志目录</button>
</div>

<div class="stage">
  <div class="screen" id="screen">
    <div class="pet-slot" aria-hidden="true"></div>
    <div class="info-col">
      <div class="time-card"><span class="time-text">08:42</span></div>
      <div class="date-card">
        <span class="date-day">25</span>
        <span class="date-week">周日</span>
        <span class="date-month">10月</span>
        <span class="date-year">2026</span>
      </div>
      <div class="battery">
        <div class="batt-body"><div class="batt-fill"></div></div>
        <span class="batt-text">87%</span>
      </div>
    </div>
    <div class="divider"></div>

    <div class="wheel" id="wheel"></div>
    <div class="ruler" id="ruler"></div>

    <div class="toc" id="toc" hidden></div>
  </div>
</div>

<div class="keys">
  <button id="btn-left" type="button">← 返回</button>
  <button id="btn-up" type="button">▲ Up</button>
  <button id="btn-ok" type="button">OK 进入</button>
  <button id="btn-down" type="button">▼ Down</button>
</div>
<div class="power-preview">
  <span id="power-status" role="status" aria-live="polite"></span>
  <button id="btn-sleep" type="button">预览浅睡</button>
</div>
<div class="hint" role="status" aria-live="polite">键盘 ↑ / ↓ 切换菜单，Enter 确认。也可点击按钮。</div>
<div class="note">无操作 4 秒：图标静止；20 秒：扫描线右移，进入亮屏浅睡布局。任意按键只唤醒，恢复后再次按键执行操作。可点击“预览浅睡”立即查看过渡。</div>
<div class="note">384×168 · 24：时间、日期数字 · 20：菜单名称 · 14：星期、年月、电量与序号。焦点图标来自固件原始点阵动画，按固件的 42×42 像素取样，反白适配黑色卡片。默认放大两倍，窄窗口自动缩放。文字使用系统字体示意 SD 卡 14-ui / 20-ui / 24-ui，字形以实机为准。</div>

const ICONS = JSON.parse(document.getElementById("firmware-icons").textContent);
if (ICONS.length !== MENU.length || ICONS.some((icon, i) => icon.label !== MENU[i])) {
  throw new Error("菜单与固件图标不匹配，请重新运行 export_icons.py");
}
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
let iconTimer = null;
let iconContext = null;
let iconFrames = [];
let lastIconFrame = -1;
const animationStart = performance.now();
let lastActivityMs = animationStart;
let powerState = "active";
let idleTimer = null;
let clockTimer = null;
let slideFrame = null;
let sleepProgress = 0;
let slideTarget = 0;
let slideStartMs = 0;
let slideFrom = 0;
let slideDurationMs = 0;
let wakeKey = null;
const wheel = document.getElementById("wheel");
const toc = document.getElementById("toc");
const ruler = document.getElementById("ruler");
const screen = document.getElementById("screen");
const powerStatus = document.getElementById("power-status");
const sleepButton = document.getElementById("btn-sleep");

function mod(n) { return ((n % MENU.length) + MENU.length) % MENU.length; }

function renderRuler() {
  ruler.innerHTML = "";
  for (let i = 0; i < MENU.length; i++) {
    const d = document.createElement("div");
    if (i === index) d.className = "active";
    ruler.appendChild(d);
  }
}

function renderA() {
  const item = MENU[index];
  wheel.innerHTML =
        `<div class="focus-card">` +
        `<div class="tick tl"></div><div class="tick tr"></div><div class="tick bl"></div><div class="tick br"></div>` +
        `<canvas class="menu-icon" width="${ICONS[index].width}" height="${ICONS[index].height}" aria-hidden="true"></canvas>` +
        `<div class="fbody"><div class="zh">${item}</div></div>` +
        `</div>`;
}

function drawIcon() {
  const icon = ICONS[index];
  const frame = reducedMotion.matches ? icon.posterFrame : Math.floor((performance.now() - animationStart) / icon.delay) % iconFrames.length;
  if (frame === lastIconFrame) return;
  iconContext.putImageData(iconFrames[frame], 0, 0);
  lastIconFrame = frame;
}

function stopIconAnimation() {
  window.clearTimeout(iconTimer);
  iconTimer = null;
}

function tickIcon() {
  iconTimer = null;
  if (document.hidden || concept !== "a" || powerState !== "active") return;
  if (performance.now() - lastActivityMs >= ICON_IDLE_MS) {
    reconcileIdle();
    return;
  }
  drawIcon();
  if (reducedMotion.matches || iconFrames.length <= 1) return;
  const elapsed = performance.now() - animationStart;
  const remaining = ICON_IDLE_MS - (performance.now() - lastActivityMs);
  iconTimer = window.setTimeout(tickIcon, Math.min(remaining, ICONS[index].delay - elapsed % ICONS[index].delay));
}

function startIconAnimation() {
  stopIconAnimation();
  if (concept !== "a" || document.hidden) return;
  const icon = ICONS[index];
  iconContext = wheel.querySelector("canvas").getContext("2d");
  iconFrames = icon.frames.map(encoded => {
    const bytes = atob(encoded);
    const image = iconContext.createImageData(icon.width, icon.height);
    const stride = Math.ceil(icon.width / 8);
    for (let y = 0; y < icon.height; y++) {
      for (let x = 0; x < icon.width; x++) {
        // 原数据中 1 为黑；焦点卡片内反白，保留原始点阵和留白边界。
        const value = bytes.charCodeAt(y * stride + (x >> 3)) & (0x80 >> (x & 7)) ? 255 : 0;
        const offset = (y * icon.width + x) * 4;
        image.data[offset] = value;
        image.data[offset + 1] = value;
        image.data[offset + 2] = value;
        image.data[offset + 3] = 255;
      }
    }
    return image;
  });
  lastIconFrame = -1;
  drawIcon();
  if (powerState === "active") tickIcon();
}

function renderB() {
  toc.innerHTML = "";
  for (let r = -2; r <= 2; r++) {
    const i = mod(index + r);
    const item = MENU[i];
    const row = document.createElement("div");
    row.className = "toc-row" + (r === 0 ? " focus" : "");
    row.style.transform = `translateY(${60 + r * 30}px)`;
    row.innerHTML =
      `<span class="idx">${String(i + 1).padStart(2, "0")}</span>` +
      `<span class="name">${item}</span>` +
      (r === 0 ? "" : `<span class="rule"></span>`);
    toc.appendChild(row);
  }
}

function render() {
  stopIconAnimation();
  renderRuler();
  renderA();
  renderB();
  wheel.hidden = concept !== "a";
  toc.hidden = concept !== "b";
  document.getElementById("tab-a").classList.toggle("active", concept === "a");
  document.getElementById("tab-b").classList.toggle("active", concept === "b");
  startIconAnimation();
}

function setPowerState(state) {
  powerState = state;
  const labels = {
    active: "主菜单 · 图标播放中（4 秒无操作后静止）",
    frozen: "主菜单 · 图标已静止（20 秒无操作后浅睡）",
    entering: "进入浅睡 · 扫描线右移",
    asleep: "亮屏浅睡 · 左侧宠物区域留白 · 按任意键唤醒",
    waking: "正在唤醒 · 恢复主菜单",
  };
  powerStatus.textContent = labels[state];
  sleepButton.disabled = state === "entering" || state === "asleep" || state === "waking";
}

function clearIdleTimer() {
  window.clearTimeout(idleTimer);
  idleTimer = null;
}

function reconcileIdle() {
  clearIdleTimer();
  if (document.hidden || !["active", "frozen"].includes(powerState)) return;
  const idle = performance.now() - lastActivityMs;
  if (idle >= SLEEP_IDLE_MS) {
    enterSleep();
    return;
  }
  if (idle >= ICON_IDLE_MS) {
    stopIconAnimation(); // 保持当前帧，不跳回封面帧。
    setPowerState("frozen");
  }
  const deadline = powerState === "active" ? ICON_IDLE_MS : SLEEP_IDLE_MS;
  idleTimer = window.setTimeout(reconcileIdle, deadline - idle);
}

function applySleepProgress(progress) {
  sleepProgress = Math.max(0, Math.min(1, progress));
  screen.style.setProperty("--sleep-offset", `${sleepProgress * SLEEP_SHIFT_PX}px`);
  const sleeping = sleepProgress === 1;
  wheel.inert = sleeping;
  toc.inert = sleeping;
}

function stopSlide() {
  window.cancelAnimationFrame(slideFrame);
  slideFrame = null;
}

function finishSlide() {
  stopSlide();
  applySleepProgress(slideTarget);
  if (slideTarget === 1) {
    setPowerState("asleep");
    return;
  }
  lastActivityMs = performance.now();
  setPowerState("active");
  startIconAnimation();
  reconcileIdle();
}

function tickSlide(nowMs) {
  slideFrame = null;
  if (document.hidden) return;
  const t = Math.min(1, (nowMs - slideStartMs) / slideDurationMs);
  const eased = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  applySleepProgress(slideFrom + (slideTarget - slideFrom) * eased);
  if (t >= 1) finishSlide();
  else slideFrame = window.requestAnimationFrame(tickSlide);
}

function slideTo(target) {
  stopSlide();
  stopIconAnimation();
  clearIdleTimer();
  slideTarget = target;
  slideFrom = sleepProgress;
  slideStartMs = performance.now();
  slideDurationMs = SLEEP_SLIDE_MS * Math.abs(target - slideFrom);
  setPowerState(target === 1 ? "entering" : "waking");
  if (reducedMotion.matches || slideDurationMs === 0) finishSlide();
  else if (!document.hidden) slideFrame = window.requestAnimationFrame(tickSlide);
}

function enterSleep() {
  if (["active", "frozen"].includes(powerState)) slideTo(1);
}

function handleDeviceKey(key) {
  if (powerState === "entering" || powerState === "asleep") {
    slideTo(0); // 唤醒键被消费，不切换焦点，也不确认进入。
    document.querySelector(".hint").textContent = "已唤醒，当前菜单保持不变。";
    return true;
  }
  if (powerState === "waking") return true;
  lastActivityMs = performance.now();
  setPowerState("active");
  if (key === "up" || key === "down") {
    index = mod(index + (key === "up" ? -1 : 1));
    document.querySelector(".hint").textContent = "键盘 ↑ / ↓ 切换菜单，Enter 确认。也可点击按钮。";
    render();
  } else {
    startIconAnimation();
    if (key === "ok") confirmSelection();
    if (key === "left") document.querySelector(".hint").textContent = "当前已是主菜单。";
  }
  reconcileIdle();
  return false;
}

function selectConcept(value) {
  handleDeviceKey("preview");
  concept = value;
  render();
}

function refreshClock() {
  window.clearTimeout(clockTimer);
  clockTimer = null;
  if (document.hidden) return;
  const now = new Date();
  const two = n => String(n).padStart(2, "0");
  document.querySelector(".time-text").textContent = `${two(now.getHours())}:${two(now.getMinutes())}`;
  document.querySelector(".date-day").textContent = two(now.getDate());
  document.querySelector(".date-week").textContent = `周${"日一二三四五六"[now.getDay()]}`;
  document.querySelector(".date-month").textContent = `${now.getMonth() + 1}月`;
  document.querySelector(".date-year").textContent = now.getFullYear();
  // 对齐 RTC 分钟刷新；只更新时间，不触发唤醒或菜单重绘。
  clockTimer = window.setTimeout(refreshClock, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()));
}

function fitPreview() {
  document.documentElement.style.setProperty("--s", Math.min(2, (document.documentElement.clientWidth - 32) / 384));
}

function confirmSelection() {
  document.querySelector(".hint").textContent = `已确认进入：${MENU[index]}（预览演示）`;
}

document.getElementById("tab-a").addEventListener("click", () => selectConcept("a"));
document.getElementById("tab-b").addEventListener("click", () => selectConcept("b"));
document.getElementById("btn-left").addEventListener("click", () => handleDeviceKey("left"));
document.getElementById("btn-up").addEventListener("click", () => handleDeviceKey("up"));
document.getElementById("btn-down").addEventListener("click", () => handleDeviceKey("down"));
document.getElementById("btn-ok").addEventListener("click", () => handleDeviceKey("ok"));
sleepButton.addEventListener("click", enterSleep);
window.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || ["Shift", "Control", "Alt", "Meta"].includes(e.key)) return;
  const key = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "ok", " ": "ok" }[e.key];
  if (wakeKey === (e.code || e.key)) { e.preventDefault(); return; }
  if (!key && ["active", "frozen"].includes(powerState)) return;
  e.preventDefault();
  if (e.repeat) return;
  if (handleDeviceKey(key || "wake")) wakeKey = e.code || e.key;
});
window.addEventListener("keyup", e => { if ((e.code || e.key) === wakeKey) wakeKey = null; });
window.addEventListener("blur", () => { wakeKey = null; });

window.addEventListener("resize", fitPreview);
function suspendPreview() {
  stopIconAnimation();
  clearIdleTimer();
  stopSlide();
  window.clearTimeout(clockTimer);
  clockTimer = null;
}

function resumePreview() {
  if (document.hidden) return;
  refreshClock();
  if (powerState === "entering" || powerState === "waking") finishSlide();
  else {
    reconcileIdle();
    if (powerState === "active") startIconAnimation();
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) suspendPreview();
  else resumePreview();
});
reducedMotion.addEventListener("change", () => {
  if (powerState === "entering" || powerState === "waking") finishSlide();
  else if (powerState === "active") startIconAnimation();
});
window.addEventListener("pagehide", suspendPreview);
window.addEventListener("pageshow", resumePreview);
fitPreview();
setPowerState("active");
render();
reconcileIdle();
refreshClock();
</script>
</body>
</html>
