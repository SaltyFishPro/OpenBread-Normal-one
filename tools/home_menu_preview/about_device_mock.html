<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenBread · 关于设备预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f1ec;color:#252a24;font:14px "Microsoft YaHei",sans-serif}main{max-width:1050px;margin:auto;padding:45px 24px}h1{font-size:28px;margin:0 0 10px;font-weight:600}.intro{color:#737a70;line-height:1.7;margin:0 0 24px}.layout{display:grid;grid-template-columns:minmax(0,760px) 235px;gap:22px}.panel,aside{background:#fff;border:1px solid #dce1d8;border-radius:20px;padding:22px}.caption{display:flex;justify-content:space-between;color:#778071;margin-bottom:16px;font-size:12px}.wrap{width:100%;aspect-ratio:384/168;background:black;overflow:hidden;border-radius:4px}.screen{position:relative;width:384px;height:168px;transform-origin:top left;background:#000;color:white;font-family:"Microsoft YaHei",sans-serif;font-size:14px;line-height:1;overflow:hidden}.head{position:absolute;top:10px;left:16px;right:16px;height:16px;display:flex;align-items:center;justify-content:space-between}.head .title{display:flex;gap:8px;align-items:center}.head svg{width:16px;height:16px;stroke:white;fill:none;stroke-width:1.4}.head .pager{font-size:14px}.cards{position:absolute;top:34px;left:16px;right:16px;display:grid;gap:6px}.hero{height:53px;display:flex;gap:12px;align-items:center;padding:0 12px;border:1px solid #fff;border-radius:12px;background:#fff;color:#000}.product-icon{width:32px;height:32px;border:1px solid currentColor;border-radius:7px;position:relative;flex:none}.product-icon:before{content:"";position:absolute;left:5px;top:5px;width:20px;height:12px;border:1px solid currentColor;border-radius:2px}.product-icon:after{content:"···";position:absolute;left:9px;bottom:1px;font-size:14px}.hero-title{font-size:20px;white-space:nowrap}.hero-sub{font-size:14px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.card{border:1px solid #fff;border-radius:10px;height:44px;padding:5px 10px;overflow:hidden}.card .label{font-size:14px;line-height:14px}.card .value{font-size:14px;line-height:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wide{grid-column:span 2}.wide .value{font-size:14px}.foot{position:absolute;bottom:7px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;line-height:16px}.keys{display:flex;justify-content:center;gap:8px;margin:22px 0 4px}.keys button,aside button{font:inherit;cursor:pointer;background:#f5f7f2;color:#344032;border:1px solid #d6ddd0;border-radius:9px;padding:9px 14px}.keys button:hover,aside button:hover{background:#e8eee3}.keys button:focus-visible,aside button:focus-visible{outline:2px solid #526b4b;outline-offset:3px}.status{margin:15px 0 0;color:#687365;font-size:13px;text-align:center;min-height:22px}aside h2{font-size:16px;margin:0 0 10px}aside p{color:#6d776a;line-height:1.65;margin:0 0 18px}aside button{width:100%;text-align:left;margin-bottom:8px}aside button.active{background:#263526;color:white;border-color:#263526}.hint{font-size:12px;color:#7c8579;margin:20px 2px 0;line-height:1.7}@media(max-width:800px){main{padding:24px 14px}.layout{grid-template-columns:1fr}aside{padding:18px}.panel{padding:14px}}
</style>
</head>
<body><main>
<h1>关于设备</h1><p class="intro">将设备名称放在首位，下面用信息卡片展示版本、设备标识和硬件状态。</p>
<div class="layout"><section class="panel"><div class="caption"><span>设备画面 · 384 × 168</span><span id="caption">设备信息</span></div><div class="wrap" id="wrap"><div class="screen" id="screen" aria-live="polite"></div></div>
<div class="keys"><button data-key="left">Left 返回</button><button data-key="up">↑ 上</button><button data-key="down">↓ 下</button></div><p class="status" id="status">按上下键翻页</p></section>
<aside><h2>预览状态</h2><p>模拟设备上的两页信息。存储和设备 ID 为示例值。</p><button data-view="0" class="active">01 · 设备信息</button><button data-view="1">02 · 硬件信息</button><p class="hint">屏内仅使用 14 和 20 像素，均属于约定的 UI 字号。网页字体用于布局预览，最终字形以 SD 字库及设备缓冲为准。</p></aside></div>
</main><script>
const screen=document.querySelector('#screen'),wrap=document.querySelector('#wrap'),status=document.querySelector('#status');let page=0;
const icon='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="1.5" width="10" height="13" rx="2"/><path d="M6 11.8h4"/></svg>';
function draw(){const content=page===0?`<div class="hero"><div class="product-icon"></div><div><div class="hero-title">OpenBread Normal One</div><div class="hero-sub">设备名称</div></div></div><div class="grid"><div class="card"><div class="label">固件版本</div><div class="value">V0.1.7</div></div><div class="card"><div class="label">设备 ID</div><div class="value">123456789ABC</div></div></div>`:`<div class="grid"><div class="card"><div class="label">屏幕</div><div class="value">2.9 寸黑白反射屏</div></div><div class="card"><div class="label">处理器</div><div class="value">ESP32-S3</div></div><div class="card"><div class="label">SD 卡</div><div class="value">3.6G 可用 / 3.8G</div></div><div class="card"><div class="label">Flash</div><div class="value">16 MB</div></div></div>`;screen.innerHTML=`<div class="head"><span class="title">${icon}关于设备</span><span class="pager">${page+1} / 2</span></div><div class="cards">${content}</div><div class="foot"><span>‹ 返回</span><span>${page===0?'↓ 下一页':'↑ 上一页'}</span></div>`;document.querySelector('#caption').textContent=page?'硬件信息':'设备信息';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',+b.dataset.view===page));}
function key(k){if(k==='up')page=0;else if(k==='down')page=1;else if(k==='left'){status.textContent='返回设置菜单（预览）';return}status.textContent=page?'第 2 页：硬件信息':'第 1 页：设备信息';draw()}
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>key(b.dataset.key)));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{page=+b.dataset.view;draw()}));document.addEventListener('keydown',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',Escape:'left'}[e.key];if(k){e.preventDefault();key(k)}});function resize(){screen.style.transform=`scale(${wrap.clientWidth/384})`}new ResizeObserver(resize).observe(wrap);draw();resize();
</script></body></html>
